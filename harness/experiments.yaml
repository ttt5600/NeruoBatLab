# The search. One entry per experiment; each changes ONE thing against a named baseline, and its
# question and success criterion are written BEFORE it runs. Edit `status` by hand to steer it.
#   proposed -> approved -> submitted -> trained -> scored -> done      (or failed / needs-human / rejected)
# The harness submits only `approved` entries, at most max_concurrent at a time, on savio_lowprio.
max_concurrent: 2
experiments:
- id: E1
  roadmap: T1
  title: run18 -- iteration-2 labels from run16 layer 6, at run16's compute
  baseline: run16_compute4x
  change: training targets, iteration-1 spectrogram k=200 -> iteration-2 run16 layer 6 k=200 (finding 055)
  question: Do better targets restart the gains that more compute stopped giving (finding 054)?
