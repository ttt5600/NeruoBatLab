method: 'E19 = slurm/train_dapt_v4_twoteacher.sh (scripts/two_teacher_labels.py builds the targets in the job; label
  NMI printed in the job log), E21 = slurm/train_dapt_v4_avesonly.sh (--only-b, same seed so the same fit files
  and frames), E20 = train_dapt_v3_avesteacher_lr2e4_seed2.sh. Scored by harness/score_run.sh (SCORE_HOST=savio-dtn).
  Detection contrasts: zfeval/experiments/paired_vs.py (observed differences, block bootstrap); call type: calltype_pair.py;
  gain differences: calltype_gain_diff.py (new, one paired bird bootstrap over both gains).'
provenance: analysis/daptv4two_2e4_step15000_*.json, daptv4aveso_2e4_step15000_*.json, daptv3aves_2e4s2_step15000_*.json,
  detection_variants.json (precommit.<tag>.joint), paired_vs.json (<a>__vs__<b>), calltype_pairs.json; savio_artifacts/logs/train_dapt_v4_2teach_39849102.log
  (label NMI)
caveats: 'One run each; E23 (E19 seed 2) and E24 (E21 seed 2) are submitted to replicate the E19-minus-E21 contrast.
  The pre-committed arms differ (E19 native_L6, E21 native_L3; E20 matched_L3, E18 matched_L6). BirdPark intervals
  cover test-sample noise only (~4 blocks, 047). E19''s large BirdPark lead over run16 is the DAPT/selection effect
  seen in every AVES-init arm (run16''s native_L0 arm is the known selection trap, 061), not a target effect. Call-type
  layers were chosen on call type; layer 3 reported beside them. The `note` field in these call-type JSONs is run15''s
  stale string. Critic (fresh subagent, CRITIC.md, 2026-10-12): ACCEPT-WITH-CHANGES; applied: BirdPark removed from
  the claim with arm spreads, layer-3 row, missing read-outs (E19+AVES, E20+run16, E21-E18), ''not distinguishable''
  wording, E21 ZF AP correction, 061 citation, 1536-vs-768-dim caveat, NMI log provenance, arm note for E20.'
