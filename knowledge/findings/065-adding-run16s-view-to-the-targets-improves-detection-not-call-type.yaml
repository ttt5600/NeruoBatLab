  AUC +0.0139 [-0.0110, +0.0461] (500: [-0.0058, +0.0355]); BirdPark AP +0.0432 [-0.0017, +0.0829] (500: [+0.0094,
  +0.0754]); AP blocks won 3/4.

  E19 minus run16, detection (observed, 1500-frame blocks): ZF AUC +0.0006 [-0.0011, +0.0029]; BirdPark AUC +0.0884
