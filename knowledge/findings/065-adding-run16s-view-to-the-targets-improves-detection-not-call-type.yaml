id: '065'
title: Adding a second teacher's view (run16) to AVES's targets raises in-distribution vocal detection against a
  matched control at every arm, but not call type, and BirdPark does not separate (one seed each)
status: confirmed
claim: 'With everything else fixed (AVES init, replay x1 stream, 15,000 updates, lr 2e-4, same per-dimension standardisation,
  same fit frames, k=200), clustering [run16 layer 6 | AVES layer 6] (E19) instead of AVES layer 6 alone (E21, the
  control) raises in-distribution ZF detection AUC: +0.0038 [+0.0015, +0.0054] at the pre-committed arms, and E19
  is ahead at all 12 of 12 arms (+0.0005 to +0.0061), about 3.5x the E18-to-seed-2 gap. BirdPark does not separate
  them: the pre-committed contrast resolves, but it rests on E21''s arm, chosen over its matched_L3 by 0.0003 ZF
  AUC; arm by arm E19 is ahead on BirdPark AUC in 4 of 12 and AP in 7 of 12, with medians 0.8999 vs 0.9012 (AUC)
  and 0.8514 vs 0.8370 (AP). 11-class call type does not move (E19 minus E21 and minus aves-base-bio cross zero,
  also at layer 3), so E19 misses its primary criterion; the pre-registered call-type mechanism read-outs do not
  resolve. E19 is not distinguishable from run16 in distribution. Because E19 clusters 1536 dims and E21 768, this
  supports ''a second teacher view in the targets'' rather than run16''s content specifically. The label gate passed
  before any score was read. E20 (E18 seed 2) fails E18''s replication criterion (ZF AUC gain over AVES does not
  resolve).'
evidence: 'E19 (daptv4two_2e4_step15000): call type 0.8441 at L0; pre-committed detection native_L6 ZF AUC 0.9724,
  BirdPark AUC 0.8969, AP 0.8490.

