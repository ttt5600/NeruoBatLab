  AUC 0.8857, AP 0.8195.

  E20 (daptv3aves_2e4s2_step15000): call type 0.8476 at L0; pre-committed detection matched_L3 ZF AUC 0.9685, BirdPark
  AUC 0.9076, AP 0.8471.

  E18 (daptv3aves_2e4_step15000): call type 0.8502 at L5; pre-committed detection matched_L6 ZF AUC 0.9696, BirdPark
