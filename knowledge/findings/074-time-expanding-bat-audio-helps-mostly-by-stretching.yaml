id: '074'
title: Slowing bat audio 4-fold into the 16 kHz encoders raises BEANS bats accuracy for run16 and AVES-bio; removing everything above 8 kHz first keeps most of the gain (more than half resolved for AVES-bio; for run16 only at the same layer)
status: open
claim: 'On BEANS bats (frozen probe, layer chosen on valid), reading the 250 kHz recordings as if recorded at 250/F
  kHz before resampling to 16 kHz raises test accuracy at F = 4 for both encoders tested: run16 +0.0800 [+0.0560,
  +0.1020] and aves-base-bio +0.0670 [+0.0445, +0.0885] over plain resampling; at F = 2 the gain is resolved for run16
  (+0.0260) and not distinguishable for aves-base-bio (+0.0190). A pre-registered control that keeps only the 0-8 kHz
  band and then slows it 4-fold (same clip length, nothing from above 8 kHz) recovers most of it: +0.0550 [+0.0330,
  +0.0765] for run16 and +0.0525 [+0.0325, +0.0715] for aves-base-bio over plain. The content above 8 kHz adds a
  further +0.0250 [+0.0025, +0.0460] for run16 at the valid-chosen layers (control L3) but +0.0000 [-0.0215, +0.0205]
  layer-matched at L0, and a not-distinguishable +0.0145 for aves-base-bio. Share of the F = 4 gain kept by the
  control: run16 0.69 [0.46, 0.96], aves-base-bio 0.78 [0.54, 1.12]; "kept part minus lost part" (2 x control - plain
  - F4) is +0.0380 [+0.0055, +0.0710] for aves-base-bio (more than half, resolved) and +0.0300 [-0.0060, +0.0675] for
  run16 at the valid-chosen layers (not distinguishable; +0.0800 [+0.0445, +0.1170] layer-matched at L0). Here
  "stretching" means 4x more frames per call and content moved 4x lower in frequency, together. Time expansion does not change
  the ranking: at F = 4 run16 is still resolved below aves-base-bio (-0.0585). This is the BEANS half of E16; its
  label-free half has not been run, so E16''s criterion is not yet decided.'
evidence: 'beans_bats.json models.<tag>: test accuracy (layer) and vs_<baseline> (observed, paired clip bootstrap
  n 2000, seed 0, 2,000 test clips, 10 classes, test majority in the JSON). run16_compute4x 0.6145 (L0); @te2 0.6405
  (L2), minus plain +0.0260 [+0.0020, +0.0505]; @te4 0.6945 (L0), +0.0800 [+0.0560, +0.1020]; @lpte4 0.6695 (L3),
  minus plain +0.0550 [+0.0330, +0.0765], minus @te4 -0.0250 [-0.0460, -0.0025]. aves-base-bio 0.6860 (L0); @te2
  0.7050 (L0), +0.0190 [-0.0030, +0.0405]; @te4 0.7530 (L0), +0.0670 [+0.0445, +0.0885]; @lpte4 0.7385 (L0), minus
  plain +0.0525 [+0.0325, +0.0715], minus @te4 -0.0145 [-0.0335, +0.0065]. Contrasts (e16_contrasts.json; probes refit
  at fixed layers from the cached features, every refit reproduces the stored test score; same paired bootstrap): share
  kept run16 0.687 [0.464, 0.962], aves 0.784 [0.540, 1.118]; 2 x lpte4 - plain - te4: run16 +0.0300 [-0.0060, +0.0675],
  aves +0.0380 [+0.0055, +0.0710]; run16 at L0 for all three arms: te4 - lpte4 +0.0000 [-0.0215, +0.0205], lpte4 - plain
  +0.0800 [+0.0580, +0.1010]. run16@te4 minus aves@te4 -0.0585
  [-0.0795, -0.0380]; plain run16 minus aves -0.0715 (063).

  Why F = 2 and 4 (measured before any expanded score; pi_notes 2026-10-14 23:49): on 300 random train clips (Welch,
  nperseg 4096) the median clip puts 0.000 of its energy at 0-4 kHz, 0.090 at 4-8, 0.756 at 8-16, 0.115 at 16-32 and
  0.003 at 32-64 kHz; 294 of 300 clips have more than half their energy above 8 kHz, so plain 16 kHz resampling drops
  about 91% of a typical clip''s energy.'
method: 'zfeval/experiments/beans_probe.py, tag suffixes added for E16: "<m>@te<F>" loads the 250 kHz file as if at
  250000/F Hz, resamples to 16 kHz and scales max_duration (5 s) by F so the same stretch of recording is kept;
  "<m>@lpte<F>" first resamples to 16 kHz (keeping 0-8 kHz) and then slows that F-fold. Verified on synthetic tones:
  a 12 kHz tone is removed by plain resampling (rms 0.0016 of 0.354) and lands at 6 kHz (F=2) and 3 kHz (F=4) with
  full amplitude; under @lpte4 a 12 kHz tone is attenuated to -55 dB (amplitude 0.0009, aliased to 1 kHz, the same
  leak plain resampling has) and a 6 kHz tone passes at 0.388 of 0.4.
  Clip lengths scale exactly (1.281 s -> 2.563 s -> 5.125 s). F=1 features are E10''s cached ones (the rerun reproduced
  the stored score, asserted). Protocol pre-registered in harness/experiments.yaml E16 (commit b480267) before any
  expanded score; the control pre-registered (commit ce2bbbf) after the F results and before the control ran.'
provenance: 'analysis/beans_bats.json (models "<tag>@te2", "@te4", "@lpte4" and their vs_* keys); analysis/e16_contrasts.json
  (zfeval/experiments/e16_contrasts.py); embeddings
  external/beans/features/bats_<split>_<tag>.npy; harness/experiments.yaml E16 protocol + control; pi_notes
  2026-10-14 23:49 and 2026-10-15 00:45.'
caveats: 'One task (BEANS bats: Egyptian fruit bats, 10 individuals, a classification of who is calling), two
  encoders, frozen probe; the gain may differ for call-type or echolocation tasks and for fine-tuning. The control
  separates "content above 8 kHz" from "longer clips at lower frequency" but not the parts of the latter: stretching
  gives each call F times more 20 ms frames and also moves the 0-8 kHz content down to 0-2 kHz, and this design cannot
  tell which of the two helps. @te4 and @lpte4 also differ in input level (median 13.7 dB, IQR 10.9-16.5, on 100 train
  clips) and beans_probe.py does no level normalisation. BEANS bats splits are random by file, so session leakage is
  possible (063). The label-free half of E16 is not run, so E16 is not decided. Layer chosen on valid
  (E10 protocol); best-test-any-layer equals the chosen layer''s score in every arm except run16@te2 (0.6450 vs 0.6405),
  aves@te2 (0.7060 vs 0.7050) and run16@lpte4 (0.6945 vs 0.6695). The last matters: at its best test layer run16''s
  control equals run16@te4 (0.6945), so the run16 "content above 8 kHz" increment rests on the valid-chosen layer.
  The energy fractions are energy, not information. Critic (fresh subagent, CRITIC.md, 2026-10-15): ACCEPT-WITH-CHANGES,
  keep open; applied: title qualified, share-kept and kept-minus-lost intervals added (refit script saved as
  e16_contrasts.py), layer-matched L0 result, "stretching" defined, level difference and session-leakage caveats, tone
  leak corrected (-55 dB, not 0). Its claim that finding 054 asks for level-normalised bats input was checked and is
  wrong (054 is about compute), so it is not cited.'
