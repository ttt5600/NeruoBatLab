id: '070'
title: Three run16 seeds span 0.019; seed 2 is lowest at the best layer and seed 1 highest at layer 3
status: confirmed
claim: 'A third seed of run16''s recipe (E7, run16_seed3) scores 0.8417 on 11-class call type at its best layer, so
  the three seeds span 0.8224 to 0.8417 (range 0.0193); at the best layer seed 3 is not distinguishable from seed 1
  (+0.0038 [-0.0074, +0.0151]) and is resolved above seed 2 (+0.0193 [+0.0052, +0.0325]), but at layer 3 seed 1 is
  highest (0.8362 vs 0.8250 and 0.8218; seed 3 minus seed 1 -0.0129 [-0.0236, -0.0029]), so which seed looks like
  the outlier depends on the layer; finding 052''s margins over run15 and run11 hold at the best layer on 2 of 3 seeds
  and at layer 3 on 1 of 3, with every point estimate positive.'
evidence: 'Best-layer 11-class call type: run16 (seed 1337) 0.8379 at L7, run16_seed2 0.8224 at L0, run16_seed3 0.8417
  at L1 (L3 0.8250). run15_combined 0.8136, run11 0.8118, aves-base-bio 0.8453.

  run16_seed3 minus (run16_seed3_bootstrap.json, observed, bird bootstrap): run16_compute4x +0.0038 [-0.0074, +0.0151];
  run15_combined +0.0281 [+0.0098, +0.0464]; run11 +0.0299 [+0.0147, +0.0498]; aves-base-bio -0.0035 [-0.0284,
  +0.0227]. calltype_pair.py: run16_seed3 minus run16_seed2 +0.0193 [+0.0052, +0.0325]. run16_seed2 minus run16 (seed
  1337) -0.0155 [-0.0289, -0.0017] (run16_seed2_bootstrap.json, 057).

  Layer 3 (run16_seed3_bootstrap.json vs["run16_seed3@L3"]): seed 3 minus run15_combined +0.0114 [-0.0028, +0.0268],
  minus run11 +0.0132 [-0.0019, +0.0326], minus run16 (seed 1337) -0.0129 [-0.0236, -0.0029], minus aves-base-bio
  -0.0202 [-0.0437, +0.0050]; resolved behind 4 of the 7 AVES checkpoints there (aves-base-all, birdaves-biox-base,
  birdaves-biox-large, aves-base-nonbio). L3 scores: seed 1 0.8362, seed 3 0.8250, seed 2 0.8218.

  Per layer (per_layer_acc11): seed 3 ahead of seed 1 at 3/12 layers, ahead of seed 2 at 12/12.

  For reference (057, 052 caveat): seed 2 minus run15 +0.0088 [-0.0099, +0.0282], minus run11 +0.0106 [-0.0070,
  +0.0322]; run16 (seed 1337) minus run15 +0.0243 [+0.0099, +0.0419], minus run11 +0.0261 [+0.0095, +0.0479].

  Detection (detection_variants.json precommit.run16_seed3.joint; ZF split = 60 s blocks within 1 recording): native_L1,
  ZF AUC 0.9713, BirdPark AP 0.5128; BirdPark AP over the 12 arms 0.4890 to 0.8295.'
method: 'slurm/train_run16_seed3.sh (run16''s script with --seed 3; job 39732808: first attempt 2026-10-10 16:09:26
  to 19:35:32 by the log, preempted after the epoch-19 checkpoint at step 50,139, resumed from last.ckpt 2026-10-12
  19:01:32, completed at step 93,750). Scored by harness/score_run.sh
  (SCORE_HOST=savio-dtn); call type pairs by calltype_pair.py.'
provenance: 'analysis/run16_seed3_calltype.json, run16_seed3_bootstrap.json, run16_seed2_calltype.json, run16_compute4x_calltype.json,
  run15_calltype.json, calltype_pairs.json ("run16_seed3 | run16_seed2"), detection_variants.json; savio_artifacts/logs/train_run16_seed3_39732808.log'
caveats: 'Pre-registered as a spread measurement with no success criterion (E7). Three draws give a range, not a
  variance. As in 057, the runs differ in seed AND preemption history (seed 3 was preempted once, after step 50,139,
  at a different point from the others), which the seed label alone does not capture. run15 and run11 each have
  one seed, so the comparisons against them rest on single baseline runs whose own spread is unknown. Best layers
  differ by seed (L7, L0, L1) and were chosen on call type, which is why layer 3 is reported beside them. This partly
  reverses 057''s "052 not reproduced": seed 3 reproduces it at the best layer, not at L3. 052 stays open: its
  headline margin is seed 1''s draw and the seed range (0.019) is close to the margin itself. The pre-committed detection
  arm (native_L1) is a weak BirdPark arm, the known selection trap (049, 061); BirdPark is not interpreted here.
  Critic (fresh subagent, CRITIC.md, 2026-10-12): ACCEPT-WITH-CHANGES; applied: retitled (no single outlier),
  claim made layer-conditional, L3 intervals and the seed 1 vs seed 2 pair added, the uninterval-ed 3-seed mean
  dropped, preemption-history caveat, log times, BirdPark arm range, 057 reversal noted.'
