id: '072'
title: Whisper encoders are point-estimate leaders on zebra finch call type and detection, not distinguishable from the top AVES and DAPT models
status: open
claim: 'Frozen and probed exactly like our models, the Whisper encoders (log-mel input, supervised speech recognition
  on 680,000 h of web audio) lead on point estimates without separating from the strongest AVES and DAPT models:
  Whisper-small (88M, 12 x 768), the only one whose best call-type layer is the fixed layer 3, scores 0.8599 there,
  not distinguishable from aves-base-bio (+0.0147 [-0.0046, +0.0359]) or birdaves-biox-large but resolved above run16
  seed 1337 (+0.0220 [+0.0016, +0.0427]), and it has the highest pre-committed in-distribution detection AUC (0.9733,
  0.0003 above run18), above aves-base-bio (+0.0059 [+0.0037, +0.0078], 10/12 arms), which meets the detection branch
  of E25''s pre-registered OR criterion, a weak bar that DAPT arms also clear; Whisper-base''s resolved call-type lead
  over aves-base-bio (0.8643 at L0, +0.0191 [+0.0042, +0.0370]) depends on choosing its best layer (L3 0.8376) and did
  not reproduce on the other sizes.'
evidence: 'Call type (e25_hf_encoders.py; calltype_pair.py, bird bootstrap, observed): Whisper-tiny encoder (8.2M, 4 x
  384) 0.8447 at L0; Whisper-base encoder (20.6M, 6 x 512) 0.8643 at L0, L3 0.8376; Whisper-small encoder (88.2M, 12 x
  768) 0.8599 at L3 (best = L3). Whisper-small minus aves-base-bio +0.0147 [-0.0046, +0.0359], minus run16 +0.0220
  [+0.0016, +0.0427], minus birdaves-biox-large +0.0047 [-0.0114, +0.0246]. Whisper-tiny minus aves-base-bio -0.0006
  [-0.0190, +0.0178], minus birdaves-biox-large -0.0106 [-0.0300, +0.0091]. At the fixed layer 3: Whisper-small 0.8599
  (its best), Whisper-base 0.8376, Whisper-tiny 0.7951 (its last block); aves-base-bio 0.8453. No L3 interval exists
  for the Whisper models (calltype_pair.py compares best layers). Whisper-base minus aves-base-core +0.0141 [-0.0052, +0.0355], minus birdaves-biox-base +0.0123
  [-0.0022, +0.0288], minus E23 +0.0079 [-0.0072, +0.0240], minus AST +0.0305 [+0.0101, +0.0508].

  Controls for Whisper-base: clip duration alone 0.393; Whisper''s own log-mel input, mean and std over real frames,
  0.667; with duration 0.723 (same probe and folds; e25_whisper_controls.py -> analysis/e25_whisper_controls.json).

  Other encoders, same protocol: AST (AudioSet, spectrogram patches, 86M) 0.8338 (vs aves-base-bio -0.0114 [-0.0338,
  +0.0122]); HuBERT-base-ls960 (speech, same architecture as ours) 0.8288 (vs run16 -0.0091 [-0.0340, +0.0134], vs
  aves-base-bio -0.0164 [-0.0357, +0.0037]); WavLM-base+ 0.8262 (vs aves-base-bio -0.0191 [-0.0372, -0.0007]);
  data2vec-audio-base 0.8118 (vs aves-base-bio -0.0334 [-0.0552, -0.0115]); wav2vec2-base 0.8022 (vs aves-base-bio
  -0.0431 [-0.0623, -0.0230]); aves-base-nonbio 0.8470 (vs aves-base-bio +0.0018 [-0.0154, +0.0189]).

  Detection (detection_variants.json precommit; paired_vs.py observed, 1500-frame blocks): Whisper-small matched_L3 ZF
  AUC 0.9733, BirdPark AP 0.8677; minus aves-base-bio ZF AUC +0.0059 [+0.0037, +0.0078], BirdPark AP +0.0620 [+0.0405,
  +0.1105]; minus run16 ZF AUC +0.0015 [-0.0005, +0.0047]. Arms: ahead of aves-base-bio on ZF AUC at 10/12 (-0.0019 to
  +0.0077) and BirdPark AP at 11/12; of run16 at 8/12 and 12/12; of E19 at 4/12 and 5/12. BirdPark AP 12-arm median
  0.8526 (E23 0.8533, E19 0.8514). Next highest pre-committed ZF AUC: run18 0.9730, E19 0.9724. Whisper-base matched_L1
  ZF AUC 0.9680 (vs aves-base-bio +0.0006 [-0.0025, +0.0024]; vs run16 -0.0038 [-0.0056, -0.0016]); Whisper-tiny
  matched_L0 0.9641 (vs aves-base-bio -0.0033 [-0.0064, -0.0017]). aves-base-nonbio native_L1 ZF AUC 0.9670 (vs
  aves-base-bio -0.0004 [-0.0030, +0.0014]).

  Label-free k30 (labelfree_stability.json, layer index 3): Whisper tiny 0.3361 (minus aves-base-bio -0.1422 [-0.2054,
  -0.0540]), base 0.4152 (-0.0631 [-0.1438, +0.0174]), small 0.4388 (-0.0395 [-0.1151, +0.0115]); AST 0.5898; data2vec
  0.5591; aves-base-bio 0.4783. Whisper-small BirdPark AP minus aves-base-bio over 12 arms: -0.0056 to +0.1100.

  Detection, same-size speech SSL (added 2026-10-13; e25_hf_frames.py, whose HuBERT-ls960 frames equal torchaudio
  HUBERT_BASE exactly on a 20 s chunk; detection_variants.json precommit, paired_vs.json observed): HuBERT-ls960 native_L3
  ZF AUC 0.9646, minus aves-base-bio -0.0028 [-0.0047, -0.0013], minus run16 -0.0072 [-0.0094, -0.0042]; wav2vec2
  matched_L1 0.9628, -0.0045 [-0.0067, -0.0027] and -0.0090 [-0.0103, -0.0064]; WavLM+ native_L3 0.9658, -0.0015
  [-0.0038, +0.0002] and -0.0060 [-0.0088, -0.0029]; data2vec native_L0 0.9649, -0.0024 [-0.0044, +0.0012] and -0.0069
  [-0.0087, -0.0027]. All four are below aves-base-bio on ZF AUC at 12/12 arms. So the speech SSL models sit at or
  below AVES on both tasks; among speech-trained encoders only Whisper-small is above AVES on ZF AUC (Whisper-base
  ties, Whisper-tiny is below).'
method: 'zfeval/experiments/e25_hf_encoders.py: Hugging Face checkpoints (openai/whisper-*, MIT/ast-finetuned-audioset-10-10-0.4593,
  facebook/hubert-base-ls960, facebook/wav2vec2-base, microsoft/wavlm-base-plus, facebook/data2vec-audio-base), each
  clip encoded alone through the model''s own feature extractor, transformer-layer outputs mean-pooled; for the
  fixed-window models (Whisper 30 s, AST 10.24 s) only tokens over real audio are pooled (real_token_index; the 034
  padding trap). Board probe (StandardScaler + LogisticRegression, StratifiedGroupKFold(5) by bird, seed 0, sklearn
  1.7.2). Detection: e25_whisper_frames.py wraps the Whisper encoder in extract_features() on detection_variants''
  20 ms grid (frame counts checked: 1000 for a 20 s chunk, 149 for 3 s; Whisper position i is centred at sample 320 i, the label
  frame at 320 i + 200, so Whisper''s features sit 12.5 ms early, which works against it). aves-base-nonbio through aves_variants_calltype.py
  and detection_variants.py. Models were fixed before their scores were read (experiments.yaml E25 notes), except
  aves-base-nonbio, scored before the batch note.'
provenance: 'analysis/hf-*_calltype.json, aves_variants_calltype.json, calltype_pairs.json ("<a> | <b>"), detection_variants.json
  (precommit, in_distribution, zf_to_bp), paired_vs.json, labelfree_stability.json, e25_whisper_controls.json; features/ct11_hf-*_emb.npy'
caveats: 'Off-the-shelf, one public checkpoint each, so there is no seed replication; the three Whisper sizes are
  different models, and the pre-committed size replication did not reproduce Whisper-base''s margin over aves-base-bio
  (small +0.0147 n.d., tiny -0.0006). Base and tiny are reported at their best layers; only Whisper-small is
  selection-free. Margins over run16 are against seed 1337 only, and run16''s seeds span 0.019 (070). Not separable here:
  the log-mel front end, the supervised objective, the 680,000 h of training audio, the width and probe dimension (384,
  512, 768), the 30 s padded context every clip sits in, and the per-clip max-8 dB floor in Whisper''s log-mel input.
  Whether the training audio contains animal sound cannot be checked. Layer index 3 is the fourth block (hidden_states[4]);
  for the label-free score it is tiny''s last block and base''s fourth of six, not the quarter-depth the rule intends.
  Detection was run only for the Whisper models and only after their call-type scores were known; E25''s detection
  branch is weak (E28a/E28b also clear it). Layer grids differ (tiny 8 arms, base 10, small 12). BirdPark is about 4
  independent blocks (047) and is not claimed. A critic check (not stored) found clip duration about equally decodable
  from every model''s embedding and adding it to the probe barely moved accuracy, so duration does not explain the
  margin. Label-free stability ranks these models differently from call type (069). Probe noise about 0.001 (float32
  vs float64 features). None of these models is ours: they point at what to change (front end, objective, data scale).
  Critic (fresh subagent, CRITIC.md, 2026-10-13): ACCEPT-WITH-CHANGES, keep open; applied: detection branch of the OR
  criterion met by small, claim reworded to point-estimate leaders, Whisper-small led (selection-free), L3 values and
  missing pairs, 070 citation, confounds named, 12.5 ms alignment, animal-sound claim dropped, layer-index wording,
  label-free intervals, BirdPark arm range.'
