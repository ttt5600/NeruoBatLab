id: '003'
title: Detection does NOT decline with encoder depth
status: refuted
claim: 'The earlier claim that detection peaks at layer 0 and declines monotonically with depth does not
  survive human labels: layers 0-7 are a statistical plateau and only 8-11 are reliably worse.'
evidence: Paired bootstrap, 2000 resamples. AUC L0-L6 = +0.0015 [-0.0014, +0.0043] on eval A and +0.0009
  [-0.0036, +0.0056] on eval B. Accuracy L5-L0 = +0.0042 [-0.0025, +0.0105], L5-L6 = +0.0006 [-0.0043,
  +0.0052]. L5 vs L9/10/11 all significant.
method: Cluster bootstrap over the 71 recordings for eval A; 30 s moving-block bootstrap for eval B, because
  adjacent 1 s windows are temporally correlated.
provenance: job 38678496; analysis/layer_bootstrap.txt; acc_vs_auc.py
caveats: 'The original claim came from cross-correlation ground truth in which silence-pinned positives
  made the task partly ''silence vs audio''. Practical consequence: use whatever layer is convenient within
  0-7.'
tags:
- layers
- bootstrap
date: '2026-09-09'
