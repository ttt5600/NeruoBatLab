id: '057'
title: A second seed of run16 scores resolved lower on call type -- one-seed comparisons overstate
status: confirmed
claim: >-
  run16 retrained with only --seed 2 scores 0.8224 on 11-class call type at its best layer (L0)
  against run16's 0.8379 (L7): observed -0.0155, bird-bootstrap [-0.0289, -0.0017], and it is
  below run16 at all 12 layers on both 11-class and 8-class. Two runs of the SAME recipe differ by
  more than the bird bootstrap resolves, so that interval does not cover training-run variation.
  E2's answer: |run16_seed2 - run16| = 0.0155 [0.0017, 0.0289]. With seed 2, run16's recipe is no
  longer distinguishable from run11 (+0.0106 [-0.0070, +0.0322]) or run15 (+0.0088 [-0.0099,
  +0.0282]); finding 052's resolved +0.0243 over run15 rests on the 1337 seed and is not
  reproduced.
evidence: >-
  Cohort 3412 clips / 11 call types / 48 birds. Per-layer 11-class, seed 2 L0-L11: 0.8224 0.8168
  0.8157 0.8218 0.8195 0.8107 0.8121 0.8048 0.8048 0.8121 0.8066 0.7992 (mean 0.8122; run16 mean
  0.8309); per-layer seed2 minus run16 ranges -0.0331 to -0.0015. Layer 3 vs run16's best layer:
  -0.0161 [-0.0324, -0.0017]. 8-class: best L0 0.8183 vs run16 L1 0.8276, means 0.8106 vs 0.8225,
  below at 12 of 12 layers (-0.0204 to -0.0028); no 8-class bootstrap was run. Against AVES at the
  best layer: -0.0229 to -0.0328, resolved behind three of six (aves-base-core, birdaves-biox-base,
  birdaves-biox-large; aves-base-all's upper bound is +0.0000) where run16 was behind none.
  Detection, pre-committed arm native L1 (ZF 0.9718 vs matched L6 0.9681): ZF in-distribution AUC
  0.9718 -- identical to run16's 0.9718 at its own pre-committed arm -- vs run11 0.9687, observed
  +0.0031 [+0.0016, +0.0048]. BirdPark AUC 0.8162 vs run11 0.8648, observed -0.0485
  [-0.1319, +0.0445] at 1500-frame blocks, seed 2 ahead in 1 of 4 blocks, not distinguishable;
  arm spread over 12 layer/normalisation variants 0.6202-0.8878 (run16 0.7271-0.8809). Chick Be/LT
  AUC 0.9895 vs run11 0.9858, observed +0.0038 [-0.0042, +0.0159]; AMI(k=4) 0.4866 vs 0.5361,
  observed -0.0495 [-0.1710, +0.1163]; neither distinguishable.
method: >-
  slurm/train_run16_seed2.sh = train_run16_compute4x.sh with --seed 2 plus job name, log and EXP
  (diff checked at submission, harness report 20261005-015326). Job 39635284: preempted after
  4h12m (05:11-09:23 Oct 5), requeued, resumed from last.ckpt, COMPLETED 0:0 at 23:23 with
  epoch=37-step=93750.ckpt. Export verified bit-identical (max|diff| 0 on three clips). Scored by
  harness/score_run.sh on 2026-10-06 (run15_calltype.py, run16_calltype_bootstrap.py,
  detection_variants.py, chick_holdout_variants.py --bootstrap); log
  harness/logs/score_run16_seed2_20261006-022628.log.
provenance: >-
  analysis/run16_seed2_calltype.json (per_layer_acc11, acc11, per_layer_acc8, acc8);
  analysis/run16_seed2_bootstrap.json (vs.run16_seed2.*, vs.run16_seed2@L3.run16_compute4x;
  delta is OBSERVED); analysis/run16_compute4x_calltype.json; analysis/detection_variants.json
  (precommit.run16_seed2, precommit.run16_compute4x, precommit.run11, zf_to_bp.run16_seed2,
  bootstrap.run16_seed2 -- delta there is the resample mean; observed differences above are from
  precommit); analysis/chick_holdout_variants.json (precommit.run16_seed2, precommit.run11,
  bootstrap.run16_seed2_vs_run11 -- resample-mean delta; printed AMI -0.0240 vs observed -0.0495).
caveats: >-
  Two runs are one draw of training-run variation, not an estimate of its variance: run16 may be
  the lucky draw, seed 2 the unlucky one, or either typical. What is established is that a gap of
  about 0.015 on call type can arise between two runs of the same recipe. That gap comes from the
  seed PLUS a different preemption history, not the seed alone: --seed sets init, masking and
  dropout (train.py:43 seed_everything; "Seed set to 2" on all 4 ranks), but the batch order is
  seeded from the epoch number (lightning_modules.py:480) and is the same for both seeds, and the
  dataloader is not resumable mid-epoch -- run16 was preempted and resumed TWICE, seed 2 ONCE, at
  different points. So no one-run comparison here with a gap of this size is evidence of a recipe
  effect on its own. 052 (run16 vs run15, +0.0243; run16 behind no AVES checkpoint) is not
  reproduced at seed 2. 054 (run17 vs run16): its best-layer gap -0.0059 was within noise but its
  layer-3 gap -0.0182 [-0.0376, -0.0009] was resolved and run17 was below run16 at all 12 layers;
  seed 2 is below run16 at all 12 layers too, from no recipe change at all, which directly
  undercuts 054's all-12-layers argument. 056 (run18 vs run16, -0.0029) is smaller than the one
  run-to-run difference observed. In-distribution detection did not move between the two runs
  (0.9718 both). The layer-3 figure above compares seed 2's L3 with run16's selected L7; L3 vs L3
  is 0.8218 vs 0.8362, -0.0144, no interval computed. The bird bootstrap stays the right
  instrument for the probe; it is just not the whole error bar. Fix going forward: any recipe
  comparison that matters gets at least two seeds per arm. Critic (fresh subagent, CRITIC.md,
  2026-10-06): ACCEPT-WITH-CHANGES; all numbers verified, --seed confirmed honoured; applied:
  -0.0485 rounding, resume counts, seed-plus-history wording, 054 restated, no "spread" from n=2.
