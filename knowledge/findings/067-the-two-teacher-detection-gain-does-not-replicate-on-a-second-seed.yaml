caveats: 'Two seeds per arm. Seed variance on call type was first shown by 057 (run16 seed 2 minus seed 1 -0.0155
  [-0.0289, -0.0017]); with E23 minus E19, two of four same-recipe seed pairs now resolve at their best layer, and
  the per-layer spreads above do not depend on layer choice. This contradicts 065''s framing of its gain as "about
  3.5x the E18-to-seed-2 gap": the control alone moved +0.0039 at L6 between seeds; 065 is moved to open. E23''s
  0.8564 is the best of about 15 DAPT arms x 12 layers, and the same recipe at seed 1 scored 0.8441, so it is not
  evidence for the recipe. The pre-committed arms differ between E23 and E24, as between E19 and E21; the 12 arms
  share audio and labels and are not independent tests. E23''s pre-committed arm is a weak BirdPark arm (its matched_L3
  reaches AUC 0.9134, AP 0.8725), so its pre-committed BirdPark deficits against E24, E19 and AVES are arm artefacts
  in the same way E19''s gains were (065); BirdPark is not claimed in either direction. Critic (fresh subagent,
  CRITIC.md, 2026-10-12): ACCEPT-WITH-CHANGES; applied: half-pass wording, seed-variance reframed (bootstrap holds
  the model fixed) with per-layer and L3 rows, sign flip of the arm contrast, 057 citation and the 065 contradiction,
  "highest DAPT arm" removed from the claim, E23 minus E19 BirdPark, AP bound, title matched to the file slug, 065
  status to open.'
