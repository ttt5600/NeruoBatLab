id: '073'
title: AVES-bio's training recipe in our code stays resolved below AVES-bio on 4 of 5 BEANS tasks on both seeds, so E29's criterion fails
status: confirmed
claim: 'Training from scratch with AVES-bio''s masking (0.8, 10-frame spans), learning rate (2e-4), warmup (32,000)
  and length (100,000 updates) on top of run17''s compute bundle, with our corpus and our iteration-1 spectrogram k=200
  targets unchanged (E29), does not meet E29''s pre-registered criterion: on both seeds, E29 minus aves-base-bio is
  resolved negative on 4 of the 5 BEANS tasks where AVES leads run16 (bats, hiceas, enabirds, dcase) and not
  distinguishable only on esc50. Against run16, E29 is resolved ahead on bats on both seeds and on esc50 on seed 1337
  only, and not distinguishable on the three detection tasks. On zebra finch, call type is not distinguishable from
  aves-base-bio, run16 or run17 on either seed at the best layer, and ZF detection AUC is resolved above aves-base-bio
  on both seeds and not distinguishable from run16 or run17. Per the pre-registration, the BEANS gap to AVES-bio is
  not closed by these four knobs; the differences that remain unmatched are corpus, targets (iteration-1 spectrogram
  vs AVES''s iteration-2 HuBERT layer-6 clusters, 038), AVES''s feature penalty (weight 10, ours 0), clip length,
  total audio and batch layout (caveats). This finding does not say which of them causes the gap; the existing
  evidence on targets is 063''s run19 (one seed, AVES''s own clusters, our recipe otherwise), not distinguishable from
  aves-base-bio on 7 of 8 BEANS tasks.'
