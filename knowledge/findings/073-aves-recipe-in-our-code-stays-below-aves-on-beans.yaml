method: 'pytorchAudio/examples/hubert/slurm/train_run29_avesrecipe.sh (+ _seed2.sh), jobs 39859251 / 39859252, 4 L40s,
  savio_lowprio. Diff against train_run17_accum2.sh (comments and blank lines stripped): --max-updates 93750 -> 100000,
  --warmup-updates 3125 -> 32000, --learning-rate 1e-4 -> 2e-4, --mask-prob 0.8 --mask-length 10 added, --seed 2 for
  E29b; data, labels, --accumulate-grad-batches 2 and everything else identical. Both reached max_steps=100000 (logs);
  E29a''s step-100000 checkpoint was not kept (not in top-5 by train_loss), so E29a is scored at epoch=78-step=99030,
  E29b at step 100000. Exported with export_weights.py (rebuilt encoder reproduces the checkpoint''s features, max|diff|
  0). Scored by harness/score_run.sh; BEANS classification beans_probe.py on the Mac; BEANS detection beans_detect.py
  on Savio (jobs 39913752, 39914954 vs aves-base-bio; 39914955 vs run16), JSONs synced back.'
