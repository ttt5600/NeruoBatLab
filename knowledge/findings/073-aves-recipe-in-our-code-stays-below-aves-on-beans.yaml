caveats: 'Four knobs changed together (mask rate/span, lr, warmup, length), so the lift over run16 on bats/esc50
  cannot be assigned to any one of them, and run17 (the same bundle with our knobs) has no BEANS score, so the lift may
  partly be run17''s 2x accumulation rather than the AVES knobs. AVES''s learning-rate schedule matches ours (fairseq
  polynomial_decay, power 1.0, end lr 0, read from datasets/11905533/aves-base-bio.pt; ours LinearDecayLRScheduler).
  Not matched, so not ruled out alongside corpus and targets (read from the AVES checkpoint cfg and the E29 script):
  the feature penalty (AVES criterion loss_weights [10.0]; ours --feature-weight 0, as in run17); clip length (ours
  --virtual-chunk-seconds 20, fixed 320,000-sample chunks; AVES max_sample_size 250,000, random_crop true, pad_audio
  false, so its batches are cropped to the shortest clip up to 15.6 s); total audio (100,000 x ~644 s = ~92% of AVES''s
  100,000 x 700 s); batch layout (4 GPUs x 2 accumulation vs 1 GPU x update_freq 8); seed. E29a misses its last 970 of 100,000 updates (near-zero lr).
  At layer 3 E29a is resolved below aves and run16 on call type while E29b is not; the two E29 seeds differ by 0.0094 at
  L3, and E29a''s 0.8200 is below all three run16 seeds at L3 (0.8218-0.8362), so the L3 deficit is one seed''s and is
  not interpreted. BEANS is a frozen linear probe (063), not AVES''s fine-tuned protocol; cbi/rfcx
  (Kaggle) are not run. Both E29 runs took ~15 h (18:02-09:53, 20:49-11:19), not the ~12 h estimated. The run29
  call-type JSONs carry run15''s stale note string ("run11 recipe ..."). Critic (fresh subagent, CRITIC.md, 2026-10-14):
  ACCEPT-WITH-CHANGES; applied: conclusion reworded to "unmatched differences", feature penalty and clip length added
  from the AVES cfg and the script, 038 and 063 (run19) cited, E29b arm counts and both seeds'' BirdPark spread, L3
  rows relabelled, seed-noise sentence replaced, stale note flagged.'
