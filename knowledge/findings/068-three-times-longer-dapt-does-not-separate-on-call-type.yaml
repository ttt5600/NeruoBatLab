  sacct --duplicates for job 39851973'
caveats: 'One seed, and finding 067 showed the seed moves this recipe''s call type by about 0.012 (E19 0.8441, E23
  0.8564), so E22''s +0.0097 over E19 is inside seed spread. Whether E22 sits between the two 15k seeds depends on the
  layer: true on the per-layer mean (above E19 by +0.0039, below E23 by -0.0072), false at L3, where E22 peaks and is
  above both (+0.0170, +0.0094, no intervals). The best-layer contrasts compare E22 at L3 with E19 at L0, E23 at L1 and
  BirdAVES at L1. The read-out has little power: E19''s own gain with run16 never resolved ([-0.0003, +0.0205]).
  Schedule confound: DAPT_STEPS stretches the linear decay, so at step 15,000 E22''s learning rate is still about two
  thirds of peak, not near zero; E22 is not E19 continued, and "more updates" cannot be separated from a different
  learning-rate path or from about 3x more passes over the same replay stream. Preemptions (log restart and resume
  lines; four attempts 1:37:54, 6:42, 11:09, 1:05:08): last.ckpt is written only at epoch ends, so every resume
  restarted from the end of epoch 3 (step 25748; then 25749, 25750, 25751, one extra batch each). At least 4,252 steps
  from attempt 1 and 1,750 from attempt 3 were discarded and retrained; the Lightning "mid-epoch" warning was a false
  alarm, and the update count and schedule are intact (45,000 steps). E22''s pre-committed arm (native_L0) is the
  known BirdPark selection trap (049, 061), so its pre-committed BirdPark deficits are arm artefacts. On the 12-arm
  view E22 is below both 15k seeds on BirdPark AP (above E19 at 1/12, E23 at 3/12), a lean that is not claimed because
  BirdPark has about 4 independent blocks. Critic (fresh subagent, CRITIC.md, 2026-10-12): ACCEPT-WITH-CHANGES;
  applied: preemption caveat rewritten from the log, layer-3 and per-layer rows, "not distinguishable" wording and
  read-out power, schedule confound, native_L0 vs matched_L3 detail with 049, E23 BirdPark arm spread.'
