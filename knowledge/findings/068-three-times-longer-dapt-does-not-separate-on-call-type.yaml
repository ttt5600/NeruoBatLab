id: '068'
title: Three times longer DAPT does not separate on call type
status: confirmed
claim: 'Training E19''s recipe (two-teacher targets, AVES init, replay x1, lr 2e-4) for 45,000 updates instead of
  15,000 (E22) gives 11-class call type 0.8538 at L3, which is not distinguishable from E19 (+0.0097 [-0.0066,
  +0.0246]) or aves-base-bio (+0.0085 [-0.0174, +0.0315]), so E22 misses its pre-registered criterion (above both,
  intervals excluding zero); in-distribution detection stays at the AVES-init DAPT level (ZF AUC +0.0036 [+0.0015,
  +0.0056] over aves-base-bio, ahead at 12/12 arms; not distinguishable from E19 or run16), and the gain from averaging
  with run16 is not distinguishable from E19''s (+0.0038 vs +0.0094, difference -0.0056 [-0.0117, +0.0018]).'
evidence: 'E22 (daptv4two45k_2e4_step45000): call type 0.8538 at L3 (best layer = the fixed layer 3); per layer
  L0 0.8365, L1 0.8438, L2 0.8394, L3 0.8538, L4 0.8494, L5 0.8274, L6 0.8318, L7 0.8283, L8 0.8253, L9 0.8315,
  L10 0.8098, L11 0.8010. Pre-committed detection native_L0 ZF AUC 0.9710, AP 0.8733, BirdPark AUC 0.7772, AP 0.6990;
  native_L0 was chosen over matched_L3 by 0.0005 ZF AUC (0.97097 vs 0.97046), and matched_L3 reaches BirdPark AUC
  0.9051, AP 0.8445.

  Layer-matched call type (per_layer_acc11, no intervals in the sources): at L3 E19 0.8368 and E23 0.8444, so E22
  minus them +0.0170 and +0.0094; across layers E22 is ahead of E19 at 8/12 (mean +0.0039) and of E23 at 3/12 (mean
  -0.0072).

  Call type (calltype_pair.py, bird bootstrap): E22 minus E19 (daptv4two_2e4_step15000, 0.8441 L0) +0.0097 [-0.0066,
  +0.0246]; minus aves-base-bio (0.8453 L3) +0.0085 [-0.0174, +0.0315]; minus E23 (seed 2 of E19, 0.8564 L1) -0.0026
  [-0.0178, +0.0111]; minus birdaves-biox-base (0.8520 L1) +0.0018 [-0.0171, +0.0188]. Probability averages: E22 +
  AVES +0.0149 [+0.0020, +0.0289] over E22; E22 + BirdAVES +0.0141 [+0.0040, +0.0255]; E22 + E19 +0.0070 [-0.0011,
  +0.0162].

  Read-out (calltype_gain_diff.py, ref run16_compute4x): gain(E22) +0.0038 [-0.0044, +0.0141], gain(E19) +0.0094
  [-0.0003, +0.0205], difference -0.0056 [-0.0117, +0.0018].

  Detection (paired_vs.py, observed, 1500-frame blocks): E22 minus aves-base-bio ZF AUC +0.0036 [+0.0015, +0.0056];
  minus run16_compute4x -0.0008 [-0.0017, +0.0014]; minus E19 -0.0015 [-0.0027, +0.0007]. BirdPark at the pre-committed
  arms: minus aves-base-bio AUC -0.1058 [-0.1349, -0.0191], AP -0.1067 [-0.1802, +0.0170]; minus run16 AUC -0.0313
  [-0.0561, +0.0111], AP -0.0461 [-0.0843, +0.0203]; minus E19 AUC -0.1197 [-0.1424, -0.0480], AP -0.1500 [-0.2005,
  -0.0438].

  Arm spread (detection_variants.json, 12 arms): vs aves-base-bio ZF AUC ahead 12/12 (+0.0011 to +0.0063), BirdPark
  AP ahead 8/12 (median 0.8345 vs 0.8115); vs E19 ZF AUC 4/12 (-0.0022 to +0.0018), BirdPark AP 1/12 (median 0.8345
  vs 0.8514); vs E23 BirdPark AP 3/12 (median 0.8345 vs 0.8533); vs run16 ZF AUC 8/12 (-0.0009 to +0.0047), BirdPark AP 10/12 (median 0.8345 vs 0.7864).'
method: 'slurm/train_dapt_v4_twoteacher_45k.sh (DAPT_STEPS=45000, E19''s labels read-only, seed as E19), job 39851973.
  Scored by harness/score_run.sh (SCORE_HOST=savio-dtn); call type calltype_pair.py and calltype_gain_diff.py; detection
  paired_vs.py; arm spread from detection_variants.json.'
