id: '075'
title: No DAPT checkpoint beats its parent on call type, zebra-finch-only DAPT included at every step; DAPT trades thuk and Wsst against tuck and tet, and most remaining errors are tuck/thuk/nest/tet on birds the probe has not heard
status: open
claim: 'Round 1 of DAPT (AVES-bio continued on zebra finch audio only, lr 5e-5 and 1e-4, a checkpoint every 2,500
  updates), never scored on call type before, sits at or below AVES-bio at all 12 checkpoints: 11 of 12 below at each
  checkpoint''s own best layer (range -0.0106 to +0.0018) and all 12 below at the fixed layer 3 (-0.0205 to -0.0041),
  none resolved. Across all 18 DAPT endpoints scored on call type (every recipe so far, each against its own parent),
  none is resolved above its parent overall (largest E23 +0.0111 [-0.0060, +0.0274]) and one is resolved below (E14,
  from BirdAVES, -0.0179 [-0.0343, -0.0023]). Per call type the checkpoints move together: Wsst (Ag) recall is above the
  parent in 18 of 18 (resolved in 9), thuk (Th) in 15 of 18, while tet (Te) is below in 18 of 18 and tuck (Tu) in 17 of
  18, and the direction repeats within each of the four seed pairs for Th and Ag (8 of 8 runs up) and for Te (8 of 8
  down). DAPT moves the boundary between neighbouring soft calls rather than adding call-type separability. Those soft
  calls are where the errors are: tet, nest, thuk and tuck are 50.5% of the clips but 76.3% of AVES-bio''s errors and
  80.4% of E23''s. As a diagnostic, letting the test birds'' other clips into training (random clip split) lifts tuck
  recall from 0.42 to 0.70 (AVES-bio) and 0.39 to 0.74 (E23), and DAPT''s overall gain over AVES-bio is larger on that
  leaky split (+0.0188) than leave-birds-out (+0.0111), so the soft-call errors are mostly about generalising to new
  birds'' voices.'
evidence: 'dapt_calltype_by_type.json: per_checkpoint.<tag>.vs_parent.<type> (observed recall difference, bird bootstrap
  2000, seed 0); pattern.<type> (counts over the 18 endpoints): Ag above 18 / resolved 9 (diffs +0.015 to +0.051), Th
  above 15 / resolved 2 (E17 +0.059, E28b +0.072), below 1 (E14 vs BirdAVES, -0.059, resolved), Te below 18 / resolved 0,
  Tu below 17 / resolved 1 (R2 CNN-frozen -0.088), ALL above 7 / below 11 / resolved 1 below; medians Th +0.048, Ag
  +0.033, Te -0.023, Tu -0.040, ALL -0.000. seed_pairs (E19|E23, E21|E24, E18|E20, E28a|E28b): Te -0.044/-0.023,
  -0.005/-0.003, -0.015/-0.023, -0.008/-0.010; Tu -0.054/-0.033, -0.038/-0.046, +0.008/-0.021, -0.050/-0.029.
  Round-1 trajectory: dapt{5e5,1e4}_step{2500..15000}_bootstrap.json vs.<tag>.aves-base-bio (best layer) and
  vs.<tag>@L3.aves-base-bio; closest to resolved: dapt5e5_step7500 at L3 -0.0205 [-0.0415, +0.0026]. error_share:
  share_of_clips 0.505, aves-base-bio 528 errors share_soft 0.763, E23 490 errors 0.804. bird_generalisation: Tu random
  split / leave-birds-out 0.70/0.42 (aves-base-bio), 0.74/0.39 (E23); Th 0.77/0.65, 0.83/0.71; overall 0.9156/0.8453,
  0.9343/0.8564. For scale, finetune_calltype.json summary.arms.full_ft.aves: AVES-bio fine-tuned end to end on the
  call-type labels 0.8600 (fold mean, 2 seeds 0.8607/0.8594) against 0.8429 for its frozen layer-3 probe in the same
  script.'
method: 'zfeval/experiments/run15_calltype.py + run16_calltype_bootstrap.py on the 12 round-1 exports (unchanged board
  protocol: 3,412 clips, 11 types, 48 birds, leave-birds-out StratifiedGroupKFold(5) seed 0, StandardScaler +
  LogisticRegression, mean-pooled clip embeddings, best 11-class layer and fixed layer 3).
  zfeval/experiments/dapt_calltype_by_type.py re-runs the board probe from the cached embeddings for every endpoint
  and its parent, asserts each pooled accuracy reproduces the stored JSON, and computes per-type recall differences
  with the shared bird bootstrap; the random-split diagnostic is StratifiedKFold(5, seed 0) on the same embeddings and
  layers. notebooks/08_calltype_errors.ipynb draws all of it (sections 2, 8-11) plus confusions, confidence and
  centroid distances (zfeval/experiments/calltype_errors.py -> calltype_errors.npz).'
provenance: 'analysis/dapt_calltype_by_type.json; analysis/dapt5e5_step*_calltype.json, dapt1e4_step*_calltype.json and
  their _bootstrap.json (new, 2026-10-15); analysis/calltype_errors.npz; analysis/finetune_calltype.json;
  notebooks/08_calltype_errors.ipynb.'
caveats: 'DRAFT ON HOLD 2026-10-16, two reasons. (1) Every number here was computed from MPS embeddings, and torch 2.8
  MPS attention is wrong for 2-8 frame inputs (1,940 of 3,412 call-type clips mis-encoded; AVES-bio call type moves
  -0.017..+0.004 per layer on CPU); it will be recomputed from CPU embeddings (calltype_cpu_rescore.py). (2) Critic
  verdict ACCEPT-WITH-CHANGES for the overall null only. The per-type "trade" largely reflects AVES-bio''s layer 3
  being low on Ag/Th and high on Te: the six other AVES/BirdAVES downloads show the same Ag/Th up, Te down against it,
  so only Tu (down in 17/18 DAPT endpoints, mixed for the downloads) looks DAPT-specific. Layer-3-vs-layer-3 counts
  differ (Te 15/17, not 18/18). "Mostly about new birds" is not supported: the random split removes only 43% of
  AVES-bio''s soft-call errors, and E23''s extra leaky-split gain is not distinguishable (+0.0076 [-0.0083, +0.0225]).
  +0.0111 is E23''s alone (the top of 18; median -0.0003). Round 1 also changed targets (run11 k=100 spectrogram
  labels, 045), not only the corpus. Not pre-registered: an analysis finding. The rewrite must apply all of this.
  The 18 endpoints are not independent replications: they share a parent (17 of 18), most share a recipe, and
  only four seed pairs exist, so "18 of 18" is a pattern across correlated runs, not 18 tests. Per-type testing is 11
  types x 18 rows; Ag is the only type resolved in more than two rows. Each endpoint is read at its own best layer
  (chosen on the reported folds, finding 035''s caveat), so per-type differences mix layer choice with training; the
  round-1 L3 column is the selection-free check for the overall number only. Di (18 clips, 11 birds) is excluded from
  every reading. The random split is a diagnostic: it lets the probe learn each test bird''s voice (034), so its
  numbers are never scores. "DAPT learns the corpus birds'' voices" is the economical reading of the larger random-split
  gain, not a tested claim; every test bird is in DAPT''s pretraining audio (028). The fine-tune comparison averages
  fold accuracies while the board pools clips. One probe protocol (frozen, linear, mean-pooled).'
