id: '075'
title: Continued pretraining on zebra finch does not raise call type beyond what any AVES-family model shows against AVES-bio; its one resolved gain (E20) is the board split's best case, and tuck, thuk, nest and tet carry about 80% of the errors
status: confirmed
claim: 'Measured on CPU embeddings (076), each model against AVES-bio with a bird bootstrap. (1) Against AVES-bio at
  each model''s own best layer, the 17 DAPT endpoints that start from it are above it on point estimate in 14 cases
  (median +0.0038, range -0.0067 to +0.0132) -- and the six other downloaded AVES/BirdAVES models, none trained on zebra
  finch, are above it in 4 of 6 (median +0.0031), with BirdAVES bioxn-large resolved above it (+0.0152 [+0.0010,
  +0.0303]) by more than any DAPT endpoint. One DAPT endpoint is resolved, E20 (E18''s recipe -- AVES-bio continued with
  AVES''s own layer-6 targets, lr 2e-4 -- at seed 2): +0.0132 [+0.0034, +0.0243] at its best layer, +0.0053 [-0.0063,
  +0.0189] at layer 3. Across 10 different fold splits of the same embeddings E20''s margin averages +0.0059 (range
  -0.0021 to +0.0132) and resolves on 1 of 10: the board split is its best case. At layer 3 no DAPT endpoint is resolved
  (11 of 17 above, median +0.0053). E14, the one endpoint started from BirdAVES biox-base, is not distinguishable from
  its parent (-0.0100 [-0.0247, +0.0058]). Continued pretraining on zebra finch has not been shown to raise call type;
  what it does to the score is the same size as the difference between any two AVES-family checkpoints. (2) Round 1
  (AVES-bio on zebra finch audio only, two training runs, 12 checkpoints, never scored on call type before) is not
  distinguishable from AVES-bio at any checkpoint at its best layer (-0.0073 to +0.0129). At layer 3 two adjacent
  checkpoints of the lr-5e-5 run (2,500 and 5,000 updates) are resolved above it (+0.0149 [+0.0011, +0.0325], +0.0205
  [+0.0026, +0.0436]); the other ten range -0.0053 to +0.0067, and the nearest independent replicate (the separate
  2,500-update run, daptshort) is not resolved (+0.0059 [-0.0036, +0.0174]). Weak hint only: 2 of 24 contrasts, close to
  the chance rate. (3) Per call type, DAPT''s shifts against AVES-bio are mostly matched by the downloads: tet goes down for
  14 of 17 DAPT endpoints (median -0.0228) and 5 of 6 downloads (-0.0171), so AVES-bio is unusually good at tet; long tonal
  and begging go up more for DAPT (medians +0.0303, +0.0182) than for the downloads (+0.0065, +0.0055), unresolved and
  with 17 linked endpoints against 6. (4) Tet, nest, thuk and tuck are 50.5% of the clips and 78.2% of AVES-bio''s errors
  (533) and 81.3% of E23''s (518). (5) A leaky random split (test birds'' other clips in training; diagnostic only) removes
  51.6% of AVES-bio''s soft-call errors and 60.3% of its other errors (E23: 55.3% and 50.5%, the reverse order); no
  difference between the two groups is shown.'
evidence: 'dapt_calltype_by_type.json (CPU): dapt.best/L3.<tag>.vs_parent.ALL (observed, bird bootstrap 2,000, seed 0);
  pattern.dapt_best.ALL (14/3, median 0.0038, min -0.0067, max 0.0132), pattern.dapt_L3.ALL (11/6, resolved 0, median
  0.0053), pattern.downloads_best.ALL (4/2, median 0.0031); downloads.best.birdaves-bioxn-large.vs_parent.ALL (+0.0152
  [+0.0010, +0.0303]); dapt.best.daptv4bird_2e4_step15000 (vs birdaves-biox-base); round1.best and round1.L3;
  dapt.L3.daptshort_5e5_step2500; pattern.dapt_best / downloads_best for Te (2/14, -0.0228 vs 1/5, -0.0171), LT (15/2,
  +0.0303 vs 4/2, +0.0065), Be (15/1, +0.0182 vs 4/2, +0.0055); error_share; bird_generalisation (soft 417 -> 202, other
  116 -> 46 for aves-base-bio; 421 -> 188 and 97 -> 48 for E23). cohort_audit.json seed_sweep.contrasts.board["E20 -
  aves-base-bio"] (10 fold-split seeds 0-9: mean +0.0059, min -0.0021, max +0.0132, a_better 1, positive 8) and
  ["E23 - aves-base-bio"] (mean -0.0001, 0 of 10 resolved).'
method: 'zfeval/experiments/dapt_calltype_by_type.py on features/ct11_<tag>_cpuemb.npy (calltype_cpu_rescore.py), each
  model at its CPU best 11-class layer (asserted to reproduce calltype_cpu_rescore.json) and at layer 3; board probe
  (cv_acc, leave-birds-out StratifiedGroupKFold(5) seed 0, sklearn 1.7.2); downloads control (aves-base-core/all/nonbio,
  birdaves-biox-base/large, bioxn-large minus aves-base-bio). Fold-split sweep: zfeval/experiments/cohort_audit.py
  (cv_acc with SEED 0-9 on the same embeddings). notebooks/08_calltype_errors.ipynb draws it.'
provenance: 'analysis/dapt_calltype_by_type.json; analysis/cohort_audit.json; analysis/calltype_cpu_rescore.json;
  critic scripts analysis/critic075/; notebooks/08_calltype_errors.ipynb.'
caveats: 'History: a first draft (MPS embeddings) claimed a DAPT "trade" between call types and that soft-call errors are
  "mostly about new birds"; its critic showed the trade was largely AVES-bio''s layer 3 and the new-birds reading
  unsupported, and 076 then showed the MPS embeddings were wrong. Second critic (2026-10-17): ACCEPT-WITH-CHANGES,
  applied -- the downloads control added to (1) with bioxn-large''s larger resolved margin, E20''s 10-split range, the
  round-1 hint narrowed (adjacent checkpoints of one run; only AVES-bio''s layer changes from the best-layer reading;
  the replicate is not resolved; "longer training erodes it" dropped, since no checkpoint-to-checkpoint difference was
  tested, 047), per-type LT/Be named as unmatched, (5) reworded to "no difference shown" with E23''s reversed order.
  Contradictions: E20 is 064''s recipe at seed 2; 064 found AVES-target DAPT does not move call type away from AVES, and
  the layer-3 null and the split sweep agree with 064, so 064 stands. E14''s former resolved deficit (066) is withdrawn
  by 076. E33''s motivation "tuck goes down in nearly every endpoint" was an MPS-era pattern and does not hold on CPU
  (tuck 9 up / 7 down at best layer). The 14-of-17 count is not 17 independent votes: AVES-bio''s one score enters every
  contrast. Recipes differ widely across endpoints (7 use run11 k=100 targets, 10 AVES or two-teacher targets; lr, stream,
  masking and length vary), so "DAPT" is a family, not one treatment. Round 1 changed targets as well as corpus (045).
  Not pre-registered: an analysis finding. One probe protocol (frozen, linear, mean-pooled). The cohort audit found 33
  duplicate copies and one double-labelled recording; fixing them moves no model by more than 0.0033 at the board''s
  folds.'
