id: '075'
title: On CPU embeddings, DAPT endpoints sit mostly slightly above AVES-bio on call type, but only one is resolved and only at its best layer; the per-type shifts are not DAPT-specific; tuck, thuk, nest and tet carry about 80% of the errors
status: open
claim: 'Measured on CPU embeddings (finding 076: the MPS caches are wrong for 2-8 frame clips), against each run''s own
  parent with a bird bootstrap. (1) Overall: of the 17 DAPT endpoints that start from AVES-bio, 14 are above it on point
  estimate at their own best layer (median +0.0038, range -0.0067 to +0.0132) and 11 at the fixed layer 3 (median
  +0.0053, range -0.0120 to +0.0114); one is resolved, E20 (AVES-bio continued with AVES''s own layer-6 targets, lr 2e-4,
  seed 2) at +0.0132 [+0.0034, +0.0243] at its best layer, and none at layer 3 (E20 there +0.0053 [-0.0063, +0.0189]).
  E14, the one endpoint that starts from BirdAVES biox-base, is not distinguishable from its parent (-0.0100 [-0.0247,
  +0.0058]). So continued pretraining on zebra finch has not been shown to raise call type; a small positive effect is
  possible but no single run establishes it, and the endpoints share a parent and mostly a recipe. (2) Round 1 (AVES-bio
  continued on zebra finch audio only, lr 5e-5 and 1e-4, a checkpoint every 2,500 updates; two training runs, 12
  checkpoints), never scored on call type before: at each checkpoint''s best layer none is distinguishable from AVES-bio
  (-0.0073 to +0.0129); at layer 3 the two earliest lr-5e-5 checkpoints are resolved above it (2,500 updates +0.0149
  [+0.0011, +0.0325]; 5,000 updates +0.0205 [+0.0026, +0.0436]) and the rest are not (range -0.0053 to +0.0205). This is
  a hint that a short, gentle specialisation helps call type and longer training erodes it, not a result. (3) Per call
  type, DAPT''s shifts against AVES-bio (for example tet down in 14 of 17 at best layer) are matched by the six other
  downloaded AVES/BirdAVES models against AVES-bio (tet down in 5 of 6), so they describe AVES-bio''s particular layer,
  not DAPT. (4) Errors: tet, nest, thuk and tuck are 50.5% of the clips and 78.2% of AVES-bio''s errors (533) and 81.3%
  of E23''s (518). (5) Letting the test birds'' other clips into training (a leaky random split, diagnostic only) removes
  51.6% of AVES-bio''s soft-call errors against 60.3% of its other errors, and E23''s gain over AVES-bio is not larger on
  that split (difference -0.0009 [-0.0183, +0.0163]); generalising to new birds is not a special problem of the soft
  calls.'
evidence: 'dapt_calltype_by_type.json (CPU embeddings): dapt.best.<tag>.vs_parent.ALL and dapt.L3.<tag>.vs_parent.ALL
  (observed differences, bird bootstrap 2,000, seed 0); pattern.dapt_best.ALL (n 17, above 14, resolved above 1, median
  0.0038, min -0.0067 dapt1e4_step15000, max 0.0132 daptv3aves_2e4s2_step15000); pattern.dapt_L3.ALL (above 11,
  resolved 0, median 0.0053, min -0.0120 daptv3aves_2e4m8, max 0.0114 daptv4aveso_2e4); dapt.best.daptv4bird_2e4_step15000
  (vs birdaves-biox-base); round1.best (none resolved, -0.0073..+0.0129) and round1.L3 (dapt5e5_step2500, dapt5e5_step5000
  resolved; -0.0053..+0.0205); pattern.dapt_best.Te (2 up / 14 down) and pattern.downloads_best.Te (1 up / 5 down);
  error_share (share_of_clips 0.505; aves-base-bio 533 errors, share_soft 0.782; E23 518, 0.813);
  bird_generalisation (aves-base-bio soft errors 417 -> 202, other 116 -> 46; E23_extra_gain_on_random_split -0.0009
  [-0.0183, +0.0163]). Also calltype_cpu_rescore_summary.json cpu_contrasts.'
method: 'zfeval/experiments/dapt_calltype_by_type.py on features/ct11_<tag>_cpuemb.npy (calltype_cpu_rescore.py), each
  model at its CPU best 11-class layer (asserted to reproduce calltype_cpu_rescore.json) and at layer 3; board probe
  (cv_acc, leave-birds-out StratifiedGroupKFold(5) seed 0, sklearn 1.7.2); the downloads control (aves-base-core/all/
  nonbio, birdaves-biox-base/large, bioxn-large minus aves-base-bio) per the first critic. notebooks/08_calltype_errors.ipynb
  (sections 2, 8-11) draws it.'
provenance: 'analysis/dapt_calltype_by_type.json; analysis/calltype_cpu_rescore.json; analysis/calltype_cpu_rescore_summary.json;
  notebooks/08_calltype_errors.ipynb.'
caveats: 'History: a first draft (2026-10-16, MPS embeddings) claimed "no DAPT checkpoint beats its parent", a DAPT
  "trade" between call types, and that soft-call errors are "mostly about new birds". Its critic (ACCEPT-WITH-CHANGES for
  the overall null only) showed the trade was largely AVES-bio''s layer 3 and that the new-birds reading was not
  supported; then finding 076 showed the MPS embeddings were wrong. This version is written on CPU embeddings with that
  critic''s controls built in; it needs its own critic before it is confirmed. Not pre-registered: an analysis finding.
  E20''s single resolved difference is at a layer picked on the reported folds (035), it is 1 of 17, and its seed twin
  E18 is not resolved; the round-1 layer-3 hint is 2 of 24 contrasts from two training runs, at a layer where AVES-bio is
  weaker than at its own best layer. Round 1 also used run11''s k=100 spectrogram targets (045), so it changed targets as
  well as the corpus. Di (18 clips) is in the overall accuracy and the error shares. One probe protocol (frozen, linear,
  mean-pooled). The cohort itself is under audit (possible duplicate recordings and one clip with two labels).'
