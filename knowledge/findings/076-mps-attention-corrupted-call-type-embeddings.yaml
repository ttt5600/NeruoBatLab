id: '076'
title: The Mac's MPS attention is wrong for 2-8 frame inputs, so every call-type score computed on the Mac is off; re-encoded on CPU, best-layer accuracies move by up to 0.014, single layers by up to 0.028, and the ranking changes
status: confirmed
claim: 'On this Mac (torch 2.8.0), scaled-dot-product attention on the MPS backend returns wrong outputs when the
  sequence has 2 to 8 frames (about 45-185 ms of 16 kHz audio); 1 frame and 9 or more frames agree with the CPU to about
  1e-6, and the CNN front end and feed-forward blocks are unaffected. CPU fp32 agrees with fp64 to about 1e-5, so the
  CPU is the correct reference. Every call-type embedding cache on the Mac (features/ct11_<tag>_emb.npy) was computed on
  MPS, and the median call-type clip is about 7 frames, so 1,939-1,940 of the 3,412 clips are mis-encoded in each of the
  47 non-Hugging-Face models re-encoded. Re-scored on CPU with the unchanged board protocol, the best-layer 11-class
  accuracy moves by -0.0132 to +0.0138 (median +0.0000, mean absolute 0.0047), the chosen layer changes for 35 of 47,
  and the MPS-vs-CPU rank correlation is 0.754; at the fixed layer 3 the change is -0.0126 to +0.0182 (mean absolute
  0.0069) with rank correlation 0.456, and across all 588 model-layer scores it is -0.0188 to +0.0281, with 38 moving by
  more than 0.014. BirdAVES bioxn-large goes from 0.8453 to 0.8590 (now first), biox-large from 0.8552 to 0.8420, and
  E23 DAPT from 0.8564 (first) to 0.8482. Conclusions this changes: 066''s resolved deficit of E14 against BirdAVES
  biox-base becomes not distinguishable (CPU -0.0100 [-0.0247, +0.0058]; layer 3 -0.0029); 067/075''s E23 margin over
  AVES-bio shrinks from +0.0111 to +0.0044 (not distinguishable); 075''s "no DAPT checkpoint beats its parent" fails for
  E20 at its best layer (+0.0132 [+0.0034, +0.0243], not at layer 3: +0.0053 [-0.0063, +0.0189]); 070''s run16 seed spread
  becomes 0.0213 (was 0.0193). Any call-type number in an earlier finding is an MPS number and must be re-read from
  analysis/calltype_cpu_rescore.json before it is compared with anything. Detection is not affected.'
evidence: 'mps_sdpa_diagnostic.json: layer0_by_T attention max abs diff MPS vs CPU on random (1, T, 768) input: T=1
  2.4e-07; T=2..8 0.36-0.67; T=9..64 5.7e-07 to 1.2e-06; feed_forward at most 2.4e-05 at every T. ten_clips:
  cpu32_vs_fp64_by_layer 3.6e-06..1.4e-05, mps32_vs_fp64_by_layer 0.28..3.8; the one bad clip of the ten is 1,671
  samples (4 frames). all_clips: 1,940 of 3,412 aves-base-bio clips changed by more than 1e-2; none of the 1-frame clips;
  1 clip with more than 8 frames. calltype_cpu_rescore.json models.<tag>: acc11_mps, best_layer_mps (the stored board
  values), acc11_cpu, best_layer_cpu, per_layer_acc11_cpu, n_clips_changed (1,939-1,940 for all 47); e.g.
  aves-base-bio 0.8453 L3 -> 0.8438 L0, run16_compute4x 0.8379 L7 -> 0.8353 L8, run11 0.8118 L3 -> 0.8180 L2,
  daptv4two_2e4s2_step15000 0.8564 L1 -> 0.8482 L0, daptv3aves_2e4s2_step15000 0.8476 L0 -> 0.8570 L0,
  birdaves-bioxn-large 0.8453 L1 -> 0.8590 L1, birdaves-biox-large 0.8552 L2 -> 0.8420 L1.
  calltype_cpu_rescore_summary.json (47 non-hf-* models): best_layer, layer3, every_layer, run16_seed_spread,
  cpu_contrasts (observed differences, bird bootstrap 2,000 seed 0, from dapt_calltype_by_type.json).'
method: 'zfeval/experiments/mps_sdpa_diagnostic.py (attention vs feed-forward by sequence length; fp64 reference on real
  clips; per-clip change by frame count). zfeval/experiments/calltype_cpu_rescore.py re-encodes the 3,412 clips with the
  same embed_all (each clip alone at its own length, mean-pooled, every layer) on device cpu, writes
  features/ct11_<tag>_cpuemb.npy beside the MPS caches (nothing overwritten) and re-runs the board probe (cv_acc,
  leave-birds-out StratifiedGroupKFold(5) seed 0, sklearn 1.7.2) at every layer. Found while setting up the E33 pre-test,
  whose CPU path did not reproduce the cached embeddings.'
provenance: 'analysis/mps_sdpa_diagnostic.json; analysis/calltype_cpu_rescore.json; analysis/calltype_cpu_rescore_summary.json;
  analysis/dapt_calltype_by_type.json; critic scripts analysis/critic076/; features/ct11_<tag>_cpuemb.npy;
  zfeval/experiments/{mps_sdpa_diagnostic,calltype_cpu_rescore}.py.'
caveats: 'Critic (2026-10-17): ACCEPT-WITH-CHANGES, applied: fixed-layer and every-layer changes added (best-layer
  "up to 0.014" alone understated it), the conclusions at risk named, statistics restricted to the 47 non-hf-* models,
  scope widened. The critic reproduced the core claim independently (its own fp64 sweep; every 2-8 frame clip changes in
  every model, none of the 24 one-frame clips) and reproduced both the stored MPS and the CPU board scores exactly from
  the caches under sklearn 1.7.2, so the device is the only thing that changed. A second, rarer MPS discrepancy: one clip
  (index 1652, 34 frames) changes by about 0.01-0.02 in four AVES-family models, traced by the critic to the
  feature-projection LayerNorm on near-constant CNN frames (variance below its eps); "9 or more frames agree" holds for
  attention only. Scope. Affected: every call-type analysis built from features/ct11_*_emb.npy (33 scripts import them):
  accuracies, per-class, confusions, split sensitivity (062), label-free stability (050, 069), clustering, identity
  probes (035), ABX-style comparisons, so findings 033-035, 040, 050-075 that quote call-type numbers carry MPS
  numbers (033''s direction survives: AVES-bio 0.8438 vs run11 0.8180 on CPU); 042''s attentive probe used a frame store
  (ct11_frames_*) computed on MPS; 036''s fine-tune trained and evaluated on MPS; 048''s chick holdout encoded chick
  calls on MPS one clip at a time (97 of 415 clips are 2-8 frames); the Hugging Face encoders are affected too
  (hf-wav2vec2-base changes 1,939 clips) and are being re-scored separately; BEANS runs on the Mac (beans_probe, each
  clip at its own length) have small exposure (2-8 frame test clips: 0.3% bats, 1.5% watkins, 0 dogs). Not affected:
  detection and BirdPark (frames from 20 s chunks, the shortest last chunk 61 frames; MPS vs CPU on 80 s of ZF and 120 s
  of BirdPark agree to 3.7e-5, critic). Not measured: past Savio results (CUDA) were never compared with CPU; eval_model.py
  now checks the GPU against the CPU on 1-9 frame clips before scoring, which guards future runs only. The size of the
  change is the size of the seed-to-seed spread (057, 070), so most pairwise conclusions need re-reading rather than
  reversal, but rankings among close models and several resolved contrasts change.'
