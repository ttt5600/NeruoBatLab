id: '092'
title: 'E37 random-projection labels: NOT MET as pre-registered — not distinguishable from run16, but resolved ABOVE run23 (MFCC k-means) at layer 3 under the tool''s df-1 seed term'
status: confirmed
claim: 'E37 RANDPROJ (pre-registered 2026-10-29): run16''s recipe and corpus trained on labels from a fixed random 39x16
  projection of standardised MFCC frames, quantised to the nearest of 200 fixed random unit vectors, score 0.8447 (L4) and
  0.8444 (L3), arm mean 0.8445. The frozen rule says "the target recipe does not matter here" only if the arm contrast vs run16
  (3 seeds) AND vs run23 are not distinguishable at the best layer and at layer 3 (seed_mean_pairs_cpu.py). Result: NOT MET.
  Not distinguishable from run16 (best +0.0125 [-0.0116, +0.0365]; L3 +0.0170 [-0.0088, +0.0429]) or from run23 at the best
  layer (+0.0025 [-0.0128, +0.0178]). At layer 3, randproj is resolved ABOVE run23 (+0.0186 [+0.0066, +0.0306]) under the
  tool''s seed term, which is randproj''s two seeds only (df 1). Sensitivity analysis, not pre-registered: with the project-wide
  pooled seed sd (0.0060, df 13, a best-layer figure assumed to carry over to L3) the interval is [-0.0001, +0.0373]; with larger
  sds it crosses zero. There is no evidence that k-means beats a fixed random quantiser of the same MFCC features (resolution
  about 0.03); the one resolved readout points the other way.'
evidence: 'calltype_cpu_rescore.json: run37_randproj 0.8447 (L4), L3 0.8435; run37_randproj_s2 0.8444 (L3); run23_mfcc 0.8420
  (L7), L3 0.8253. seed_mean_pairs_cpu.json / _L3.json "randproj | run16", "randproj | run23" (2026-11-15, both seeds;
  "randproj | run23" L3 resolved: true). calltype_split_sensitivity_cpu.json 10-split means: randproj 0.8330 / 0.8376, run23
  0.8336. Seeds are distinct models: they disagree on 1 of 3412 clips in pooled accuracy only; local export files
  ~/zf_labelset/external/dapt/run37_randproj{,_s2}.pt md5 68a2c849... vs 04a77c46...; embedding files differ (max |diff| 6.2 at
  L3); per-layer profiles differ (L0 0.8359 vs 0.8309); "Seed set to 2" on all 4 ranks
  (savio_artifacts/logs/train_run37_randproj_seed2_40654077.log). Sensitivity intervals recomputed by the critic.'
method: 'Labels scripts/random_labels.py on savio-dtn (perplexity 144.6, 200/200 codes). slurm/train_run37_labels.sh, jobs
  40654076 (s1337) and 40654077 (s2) on paid A40; `max_steps=93750` reached, final.ckpt. Scored with harness/score_run.sh
  (harness/logs/score_run37_randproj_s2_20261115-004032.log). Arm contrasts zfeval/experiments/seed_mean_pairs_cpu.py.'
provenance: '~/zf_labelset/zf_detection_dataset_v1/analysis/{calltype_cpu_rescore.json, seed_mean_pairs_cpu.json,
  seed_mean_pairs_cpu_L3.json, calltype_split_sensitivity_cpu.json}; savio_artifacts/logs/train_run37_randproj_seed2_40654077.log.'
caveats: 'run23 is one seed and its L3 (0.8253) is far below its L7 (0.8420); run16''s three seeds span 0.8127-0.8368 at L3, so
  seed luck in run23 could explain the L3 resolution (a reason for caution, not a re-verdict). vs run16 changes both the input
  features and the quantiser; only vs run23 is a one-change test of k-means. Random projection still starts from MFCC input.
  Power about 0.03.'
lesson: 'A fixed random quantiser of MFCC frames does at least as well as k-means on the same frames at this budget. Forward rule:
  pre-register the pooled seed variance to use for one-seed arms, so a single-seed comparator cannot borrow an implausibly small
  seed term (and the author cannot pick one afterwards).'
critic: 'REJECT as drafted -> rewritten (2026-11-15, fresh critic): draft called the rule met at "three of four readouts" and
  widened only the failing readout with a post-hoc seed sd (mislabelled as run16''s; it was the pooled randproj+run16 L3 sd);
  "k-means not what makes targets work" and "any target works equally" overreached; per-dimension correlation figure was wrong
  (dimension 0 only) and is dropped. Verdict now "not met" as the critic allowed.'
