id: '063'
title: On BEANS under a frozen probe, AVES is resolved ahead of run16 on 5 of the 9 tasks run, and run11 is resolved
  behind run16 on 6
status: open
claim: 'With every encoder frozen (mean-pooled layers, linear probe, layer chosen on valid), on the 9 BEANS tasks
  run (of 10 non-Kaggle), aves-base-bio is ahead of run16 with the 95% interval excluding zero on 5: bats, esc50,
  hiceas, enabirds, dcase. It is not distinguishable on watkins, humbugdb and dogs (dogs: run16 ahead on the point
  estimate), and hainan-gibbons is not interpretable. run11 is resolved behind run16 on 6 of 9 (dogs, esc50, hiceas,
  enabirds, dcase, gibbons), so most of run11''s gap outside zebra finch was closed by run16. Each of AVES''s resolved
  leads exceeds the run16 seed-to-seed gap on that task. Pre-registered question (E10), ours against AVES with intervals,
  on the 8 interpretable tasks: run16 is resolved behind aves-base-bio on 5 (bats, esc50, hiceas, enabirds, dcase),
  its second seed on 4, run20 on 6, run11 on 7, and run19 on 1 (enabirds), not distinguishable from AVES on the
  other 7. Outside zebra finch our from-scratch spectrogram-target models are behind AVES on most tasks; the one
  model trained on AVES-made targets is level with it on all but one.'
