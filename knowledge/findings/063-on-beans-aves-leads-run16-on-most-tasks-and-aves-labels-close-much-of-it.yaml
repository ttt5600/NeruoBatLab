method: 'zfeval/experiments/beans_probe.py (classification: own-length clips truncated to max_duration, never zero-padded
  -- finding 034; StandardScaler + LogisticRegression) and beans_detect.py (detection: BEANS RecognitionDataset
  windows, labels and AveragePrecision reimplemented and verified identical; per-class L2 logistic regression, C=1,
  L-BFGS). Splits made by BEANS''s own scripts (beans_fetch.sh) and checked against BEANS''s published MD5s. Detection
  ran on Savio (job 39836981, L40S); hiceas reproduced the Mac MPS run to ~0.0003 mAP at identical layers.'
provenance: analysis/beans_{bats,watkins,dogs,humbugdb,esc50,hiceas,enabirds,dcase,hainan_gibbons}.json, key models.<tag>.test
  and models.<tag>.vs_run16_compute4x; models.<tag>.vs_aves-base-bio (beans_probe.py / beans_detect.py --baseline
  aves-base-bio; detection rerun Savio job 39851650, rescoring asserted to reproduce every stored score)
caveats: 'A frozen probe, NOT AVES''s published protocol (fine-tuning the whole network per task), so no number
  here is comparable to the published BEANS row (bats 0.748 fine-tuned vs 0.686 frozen here). One seed per model
  except run16. 11 models x 9 tasks: about 5% of null comparisons exclude zero by chance. Ours-vs-AVES intervals
  added 2026-10-12 (reruns with --baseline aves-base-bio; each rerun asserted the stored layer and test score were
  reproduced). run19''s parity with AVES is one seed (E8 pending) and is not a mechanism claim: its targets come
  from AVES, itself trained on general audio. hainan-gibbons has no AVES-baseline intervals (the rerun hit its 2
  h limit there) and is excluded as before. run19 and run20 are reported, not interpreted: run16 already trains
  on combined_zf_fsd (~108 h of FSD50K), so run20 REMOVES colony audio rather than adding general audio (and gets
  ~2x passes and a zebra-finch-shaped codebook; its pre-registered baseline run21 was not scored on BEANS); run19''s
  targets come from AVES, itself trained on general audio; one run19 seed, E8 pending. Sits beside finding 039 (corpus
  as the live hypothesis) and 059 (run19 not distinguishable from run16 on call type) without settling either. Bootstrap
  units: dcase test = 232 chunks from 19 recordings; hainan-gibbons = 640 chunks from 4 recordings, so its chunk
  bootstrap is far too narrow and every model''s mAP there is under 0.15 -- not interpretable. BEANS bats splits
  are random by file (session leakage possible). speech-commands not run; cbi and rfcx need a Kaggle account. Critic
  (fresh subagent, CRITIC.md, 2026-10-12): ACCEPT-WITH-CHANGES; applied: watkins "not distinguishable", gibbons
  "not interpretable", dcase bootstrap unit, run11 added, "5 of 9" wording, seed sentence narrowed, run19/run20
  mechanism dropped from title and claim, confounds and 039/059 named, L40S. Ours-vs-AVES intervals since added
  (second critic pass pending).'
