id: '083'
title: Not additive -- AVES-teacher labels on general audio only tie AVES labels on the full mix; the gain over our labels on general audio resolves against one of its two seeds
status: confirmed
claim: 'run22 (run16''s recipe on the 643 FSD50K files, 108.39 h, with the AVES-teacher k=200 labels) scores 0.8511 on CPU
  11-class call type (majority-class 0.1797), resolved above run20 seed 1 (same files, our spectrogram labels) at +0.0229 [+0.0045,
  +0.0436] best layer and +0.0173 [+0.0008, +0.0366] at layer 3 (against run20 seed 2 the best-layer lower bound is exactly
  0.0000 and layer 3 is +0.0170 [-0.0019, +0.0396], not distinguishable), but not distinguishable from run19 (AVES labels on the full
  224 h ZF+FSD50K mix) at +0.0053 [-0.0115, +0.0205] best layer and -0.0067 [-0.0201, +0.0058] at layer 3, nor from run19
  seed 2 (-0.0035 / -0.0141, both n.d.), so E12''s pre-registered success (above BOTH run19 and run20 with intervals
  excluding zero) is not met and the result is "not additive": with AVES labels, the FSD50K-only run is not distinguishable from the 224 h mix
  on call type, a comparison confounded with run22 seeing each FSD50K file about 2.07x as often at fixed updates.'
