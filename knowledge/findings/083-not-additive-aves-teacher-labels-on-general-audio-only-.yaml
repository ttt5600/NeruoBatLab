method: 'E12 (harness/experiments.yaml). Corpus = scripts/subset_corpus.py via build_fsd_only_corpus.sh on combined_aves_teacher/data/hubert_6:
  643/763 files, 108.39 h, 200 cluster ids, the same file set as run20; train script = train_run20_fsdonly.sh with only DATA/EXP
  changed (job 40090445). Step-final export embedded on CPU (finding 076) by score_run.sh; board probe (StandardScaler +
  LogisticRegression, leave-birds-out StratifiedGroupKFold(5), seed 0; 3,412 clips, 48 birds). Pairs: seed_pairs_cpu.py,
  2,000 bird resamples, seed 0, at best layers and --layer 3. 10-split column: calltype_split_sensitivity.py --cpu.
  Majority-class rate from aves_variants_calltype.json cohort11.majority (0.17966).'
