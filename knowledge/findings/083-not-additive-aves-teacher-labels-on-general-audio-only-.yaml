caveats: 'Critic (2026-10-25): ACCEPT-WITH-CHANGES, applied: title leads with not additive, run22 > run20 limited to run20 seed 1, 2.07x-passes confound, preemption and feature-type notes, majority-rate source added. One seed of run22; run19 and run20 each have two. Confound against run19: at a fixed 93,750 updates the 108.39 h
  FSD50K-only corpus is passed about 2.07x as often per file as in the 224.42 h mix (224.42 / 108.39), so "no zebra finch
  audio" is not the only change; train_run20_fsdonly.sh''s header asks for this to be stated. Training history: run22 was
  preempted and resumed twice (log 40090445); run19 and run20 ran uninterrupted. run19 trained with --feature-type hubert and
  run22 with spectrogram, a no-op at train time (only the mfcc branch changes the collate, dataset/hubert_dataset.py:527).
  Against run20 the only change is the labels (script diff); label frame counts differ by 28 (trailing frame, 055). Best layers were selected on the board split (run22 L2), hence
  the layer-3 reading; at layer 3 run22 is BELOW both run19 seeds in point estimate (-0.0067, -0.0141), so the best-layer
  edge over run19 (+0.0053) and the 10-of-10 split agreement against run19 seed 1 are layer-selection-sensitive and are not
  claimed. Against run20 seed 2 the best-layer lower bound is exactly 0.0000 and is recorded unresolved, so run22 > run20 is
  resolved against one of run20''s two seeds at the best layer and at layer 3 against seed 1 only. The 10 splits reuse the
  same 48 birds; agreement across them is not an interval. "Does not add up" is about call type only. The labels on the
  FSD50K rows are AVES''s k-means of AVES features on that audio, which saw zebra finch audio only through AVES''s own
  pretraining, so "no zebra finch audio" means none in OUR pretraining. Contradictions: none; consistent with 059 (AVES labels
  at run16''s compute not distinguishable from run16), 061/078 (general audio alone ties colony audio) and 077 (run19''s
  seeds above run16''s in point estimate).'
