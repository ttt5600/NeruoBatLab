id: '052'
title: Four times the audio per update closes most of the AVES call-type gap
status: confirmed
claim: >-
  run16 -- run15's exact recipe with the four requested GPUs actually realised, so each optimiser
  update sees 4.0x the audio (322 s vs 80.5 s) at the same 93750 updates and lr 1e-4 -- beats
  run15 and run11 on 11-class call type by resolved margins (+0.0243 [+0.0099, +0.0419] and
  +0.0261 [+0.0095, +0.0479]) and is no longer distinguishable from any of the six AVES
  checkpoints, which every earlier ZF model lost to by resolved margins.
evidence: >-
  Cohort 3412 clips / 11 call types / 48 birds; majority-class rate 0.1797 (Te, 613 clips).
  Best-layer accuracy: run16 0.8379 (L7), run15 0.8136 (L3), run11 0.8118 (L3); AVES
  aves-base-bio 0.8453, aves-base-all 0.8479, aves-base-core 0.8502, birdaves-biox-base 0.8520,
  birdaves-biox-large 0.8552, birdaves-bioxn-large 0.8453. run16 minus each AVES checkpoint
  (paired bird bootstrap, 2000 resamples): aves-base-bio -0.0073 [-0.0301, +0.0170],
  aves-base-core -0.0123 [-0.0337, +0.0130], aves-base-all -0.0100 [-0.0297, +0.0119],
  birdaves-biox-base -0.0141 [-0.0341, +0.0070], birdaves-biox-large -0.0173 [-0.0391, +0.0061],
  birdaves-bioxn-large -0.0073 [-0.0287, +0.0140] -- all intervals cross zero. For comparison
  run15 lost to aves-base-bio by -0.0317 [-0.0603, -0.0038] (finding 051). The gain is not a
  layer-picking artefact: EVERY run16 layer (L0 0.8239 ... L11 0.8203, peak L7 0.8379) beats
  run15's best layer (0.8136), and at run15's own layer 3 run16 scores 0.8362, still +0.0226
  [+0.0082, +0.0381] over run15. 8-class: run16 0.8276 vs run15 0.8193 and run11 0.8193 (not
  bootstrapped). Pretraining fit: per-step training loss, same loss and same 200-class vocabulary,
  logs stitched across preemptions (later attempt wins where they overlap): steps 8-12k run16
  2.019 vs run15 2.333, 28-32k 1.378 vs 1.754, 58-62k 1.120 vs 1.525, 88k-end 1.047 vs 1.254.
method: >-
  slurm/train_run16_compute4x.sh = train_run15_combined.sh with --ntasks-per-node=4 (the fix
  from the 4-GPU smoke test: --gpus 4 under --ntasks=1 had realised ONE GPU in every earlier run)
  and --cpus-per-task=8; nothing else changed -- same corpus (combined ZF+FSD50K, 224.42 h,
  k=200 labels), lr, warmup 3125, max-updates 93750, feature-weight 0, virtual-chunk-seconds 20,
  HUBERT_NORMALIZE_INPUT=0. Realised compute verified from checkpoints, not assumed: 2507.1
  steps/epoch (run15 10032) -> 224.42 h / 2507.1 = 322.2 s of audio per update, 8,392 h seen in
  total (run15 2,097 h; AVES 19,444 h, so run16 is at 43% of AVES). Log shows MEMBER 1/4..4/4.
  Weights exported with export_weights.py (bit-identical, max|diff| 0 at three clip lengths).
  Scored by zfeval/experiments/run15_calltype.py --tag run16_compute4x (same encode, same
  leave-birds-out StratifiedGroupKFold(5) seed 0, same mean-pooled multinomial logistic probe
  as every AVES row). Intervals from zfeval/experiments/run16_calltype_bootstrap.py, every
  model at its own best 11-class layer.
provenance: >-
  Savio job 39203444 (preempted twice, auto-requeued, completed 2026-09-24 15:18, exit 0);
  checkpoint temp_train_run16_compute4x/.../epoch=37-step=93750.ckpt; weights
  external/dapt/run16_compute4x.pt; analysis/run16_compute4x_calltype.json,
  analysis/run16_bootstrap.json; metrics savio_artifacts/metrics/run16/; log
  savio_artifacts/logs/train_run16_compute4x_39203444.log
caveats: >-
  "Not distinguishable" is NOT "tied": every AVES point estimate is still ahead, by 0.007 to
  0.017, and the intervals are about 0.045 wide, so a real gap of that size could not be
  resolved here. The lever is "4x audio per update at fixed updates and lr", which bundles a 4x
  larger effective batch (less gradient noise), 4x more total audio seen, and 4.0x more passes
  over the same corpus (37.4 vs 9.35); this experiment cannot separate them -- but it is the
  same bundle AVES used (update_freq 8 on one GPU). One training seed per arm: the bootstrap
  resamples birds, not pretraining runs, so seed-to-seed variation of the encoder is unmeasured
  for every model in the table. run16's layer 7 was selected on the reported metric (finding
  046); the layer-3 check above bounds that. Call type only -- detection, the BirdPark holdout
  and the chick holdout have NOT been scored for run16. Two preemptions resumed from
  epoch-end checkpoints; step counts per epoch are unchanged across resumes, so no batches were
  replayed. Does NOT say corpus size is irrelevant at higher compute -- 051 held compute fixed.
  The logged train_masked_accuracy is NOT usable for any cross-run comparison in this project:
  mask_stats accumulate from process start and are reset only in on_validation_end, which never
  runs, so the value is a running mean since the last (re)start -- it lags and jumps at each
  resume (run16's jumps at step 30085, run15's at ~10030). This also undercuts the masked-accuracy
  numbers quoted in 051's caveats, which that finding had already declared incomparable.
