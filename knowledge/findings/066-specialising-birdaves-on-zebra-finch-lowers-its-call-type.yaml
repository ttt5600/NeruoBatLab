id: '066'
title: In one seed, specialising BirdAVES on zebra finch with the two-teacher recipe scored lower on 11-class call
  type than BirdAVES, and detection did not separate from it
status: confirmed
claim: 'E14 runs the E19 recipe (two-teacher targets, replay x1 stream, 15,000 updates, lr 2e-4, E19''s labels read-only)
  from birdaves-biox-base instead of aves-base-bio. 11-class call type falls from 0.8520 (BirdAVES, L1) to 0.8341
  (E14, L1): -0.0179 [-0.0343, -0.0023], so E14 misses its pre-registered criterion (above 0.8520, interval excluding
  zero) in the wrong direction. E14 at layer 3 (not chosen on call type) is also behind: -0.0182 [-0.0364, -0.0008]. Layer by
  layer E14 is behind BirdAVES at 8 of 12 layers; the gap is largest at L0-L2, where BirdAVES peaks (-0.0149, -0.0179,
  -0.0126), and shrinks with depth; deeper layers are mixed (no per-layer intervals). E14 is not
  distinguishable from E19 (-0.0100 [-0.0260, +0.0053]) or aves-base-bio (-0.0111 [-0.0330, +0.0095]) on call
  type. In-distribution detection: E14 is not distinguishable from BirdAVES (ZF AUC +0.0018 [-0.0017, +0.0031]) or
  E19 (-0.0010 [-0.0032, +0.0005]); it beats aves-base-bio (+0.0041 [+0.0013, +0.0056], ahead at 12/12 arms), the
  same AVES-init DAPT level E19 reached; against BirdAVES its ZF AP is ahead at 12/12 arms (+0.0005 to +0.0101),
  a lean, not a separation (the arms are not independent). BirdPark: the pre-committed contrast with BirdAVES resolves (AP +0.0426),
  but it rests on BirdAVES''s pre-committed native_L3 arm, chosen over matched_L3 by 0.0006 ZF AUC (against matched_L3
  the gap is AUC +0.0038, AP +0.0121); arm by arm E14 is ahead on BirdPark AUC in 4 of 12 and
  AP in 5 of 12, with lower medians (AUC 0.8809 vs 0.8987, AP 0.8259 vs 0.8416) and arm differences from -0.0344 to
  +0.0172 (AUC) and -0.0439 to +0.0287 (AP), so BirdPark is not claimed.'
evidence: 'E14 (daptv4bird_2e4_step15000): call type 0.8341 at L1; pre-committed detection matched_L6 ZF AUC 0.9714,
  AP 0.8702, BirdPark AUC 0.8992, AP 0.8339.

  birdaves-biox-base: call type 0.8520 at L1; pre-committed detection native_L3 ZF AUC 0.9697, BirdPark AUC 0.8665,
  AP 0.7914.

  Call type (calltype_pair.py, bird bootstrap): E14 minus birdaves-biox-base -0.0179 [-0.0343, -0.0023]; minus
  E19 (daptv4two_2e4_step15000, 0.8441 at L0) -0.0100 [-0.0260, +0.0053]; minus aves-base-bio (0.8453 at L3) -0.0111
  [-0.0330, +0.0095]. Probability averages: E14 + BirdAVES 0.8535 (+0.0015 [-0.0087, +0.0113] over BirdAVES); E14
  + AVES +0.0100 [-0.0024, +0.0220]; E14 + E19 +0.0050 [-0.0032, +0.0124].

  E14 at L3 (0.8338) minus birdaves-biox-base (L1): -0.0182 [-0.0364, -0.0008]; minus aves-base-bio -0.0114 [-0.0302,
  +0.0073] (daptv4bird_2e4_step15000_bootstrap.json). Layer-matched L3 vs L3: -0.0091, no interval.

  Call type per layer, E14 minus BirdAVES: L0 -0.0149, L1 -0.0179, L2 -0.0126, L3 -0.0091, L4 -0.0062, L5 -0.0035,
  L6 +0.0003, L7 +0.0053, L8 -0.0009, L9 +0.0044, L10 +0.0126, L11 -0.0097 (behind at 8/12).

  Detection (paired_vs.py, observed, 1500-frame blocks): E14 minus birdaves-biox-base ZF AUC +0.0018 [-0.0017, +0.0031],
  ZF AP +0.0031 [-0.0059, +0.0077]; BirdPark AUC +0.0327 [+0.0155, +0.0629], AP +0.0426 [+0.0158, +0.0891], 4/4
  blocks. E14 minus E19 ZF AUC -0.0010 [-0.0032, +0.0005]; BirdPark AUC +0.0022, AP -0.0150, both not distinguishable.
  E14 minus aves-base-bio ZF AUC +0.0041 [+0.0013, +0.0056]; BirdPark AUC +0.0161 [+0.0017, +0.0361], AP +0.0282
  [+0.0122, +0.0383].

  BirdAVES pre-committed arms: native_L3 (ZF AUC 0.9697, BirdPark AUC 0.8665, AP 0.7914) chosen over matched_L3 (ZF
  AUC 0.9690, BirdPark AUC 0.8954, AP 0.8218).

  Arm spread (detection_variants.json in_distribution / zf_to_bp, 12 arms): vs BirdAVES ZF AUC ahead 11/12 (-0.0011
  to +0.0043), ZF AP 12/12 (+0.0005 to +0.0101), BirdPark AUC 4/12 (-0.0344 to +0.0172), AP 5/12 (-0.0439 to +0.0287),
  medians AUC 0.8809 vs 0.8987, AP 0.8259 vs 0.8416. vs E19 ZF AUC 6/12
  (-0.0020 to +0.0018), BirdPark AUC 5/12, AP 3/12. vs aves-base-bio ZF AUC 12/12 (+0.0036 to +0.0067), BirdPark
  AUC 9/12, AP 9/12, medians AUC 0.8809 vs 0.8822, AP 0.8259 vs 0.8115.

  Chick holdout (chick_holdout_variants.json): E14 0.9972 (matched_L6) minus run11 0.9858 = +0.0114 observed, interval
  [+0.0000, +0.0290], not distinguishable; BirdAVES has no chick precommit entry, so no comparison with the baseline.'
method: 'slurm/train_dapt_v4_twoteacher_birdaves.sh (DAPT_INIT = birdaves-biox-base, DAPT_DATA = E19''s built labels,
  read-only), job 39851972, 15,000 steps, 49:46 by the log (15:25:56 to 16:15:42); seed 1337, 210 tensors transplanted. Scored by harness/score_run.sh (SCORE_HOST=savio-dtn); export_weights.py
  reproduced the checkpoint''s features before writing. Call type: calltype_pair.py (reproduces the stored accuracies);
  detection: paired_vs.py; arm spread from detection_variants.json.'
provenance: analysis/daptv4bird_2e4_step15000_calltype.json, daptv4bird_2e4_step15000_bootstrap.json, aves_variants_calltype.json
  (birdaves-biox-base per_layer_acc_11), detection_variants.json (precommit.<tag>.joint, in_distribution, zf_to_bp),
  paired_vs.json (daptv4bird_2e4_step15000__vs__*), calltype_pairs.json; savio_artifacts/logs/train_dapt_v4_bird_39851972.log
caveats: 'Departs from the pre-registered change: E14''s `change` field names the DAPT replay x1 recipe (058: run11
  labels, lr 5e-5), but the run used E19''s round-4 recipe (two-teacher targets, lr 2e-4), as the notes field records;
  this result covers the E19 recipe only. One seed; one-run call-type gaps of ~0.015 have failed to reproduce before (057), so the -0.0179 is the
  observed difference for this run, not a settled effect size. The upper bound (-0.0023) is smaller than the ~0.006 the fold split alone moves
  scores (062), and BirdAVES''s L1 peak stands only ~0.007 above its L0 and L2. Call-type layers were chosen on call type (both models
  peak at L1). The targets were built from AVES and run16 features, not BirdAVES features, so E14 changes the init
  and keeps targets foreign to its starting model; this run cannot separate "DAPT hurts BirdAVES" from "these targets
  do not suit BirdAVES". BirdPark intervals cover test-sample noise only (~4 blocks, 047). The `note` field in the
  call-type JSON is run15''s stale string. Critic (fresh subagent, CRITIC.md, 2026-10-12): ACCEPT-WITH-CHANGES; applied:
  observed chick difference (was the resample mean), layer-3 interval, pre-registration departure, log elapsed time,
  deep-layer wording, 062 citation, title scope, BirdAVES matched_L3 context and BirdPark arm ranges, ZF AP arm spread.'
