id: '078'
title: General audio alone holds its level on a second seed (CPU call type 0.8324 vs 0.8283), level with run16 and below both run19 seeds; on CPU it was never above run16
status: open
claim: 'A second seed of run20 (E9, run20_seed2: run16''s recipe on the FSD50K rows only, spectrogram k=200 labels)
  scores 0.8324 on 11-class call type at its CPU best layer (L5), against 0.8283 (L6) for the first seed; the seed
  pair differs by +0.0041 [-0.0104, +0.0172], so general audio alone holds its level. E9 was pre-registered as a
  spread measurement with no success criterion. On CPU embeddings (076) neither run20 seed is above run16 seed 1
  (0.8353; -0.0029 [-0.0272, +0.0178] and -0.0070 [-0.0355, +0.0167]), so 061''s "general audio alone matches the
  mixed corpus" stands as "not distinguishable", but the near-tie of its MPS numbers (0.8370 vs 0.8379) becomes a
  small deficit on CPU: both run20 seeds sit below run16 seeds 1 and 3 (0.8353, 0.8411) and above seed 2 (0.8198). run20_seed2 is resolved below run19_seed2 (-0.0223 [-0.0419, -0.0049]) and not
  distinguishable from run19''s first seed (-0.0135 [-0.0338, +0.0026]).'
evidence: 'CPU call type (calltype_cpu_rescore.json models.<tag>; best layer / layer 3): run20_seed2 0.8324 L5 / 0.8203;
  run20_fsdonly 0.8283 L6 / 0.8200; run21_zfonly 0.8127 L1 / 0.8107; run16_compute4x 0.8353 L8 / 0.8312; run16_seed2
  0.8198 L1; run16_seed3 0.8411 L4; run19_avesteacher 0.8458 L1; run19_seed2 0.8546 L1; aves-base-bio 0.8438 L0.
  run20_seed2''s MPS score (run20_seed2_calltype.json acc11) was 0.8368 at L8; 1,939 of 3,412 clips changed between
  devices. run20_fsdonly''s MPS score (061) was 0.8370.

  Paired, observed difference [95% bird bootstrap, 2,000 resamples of 48 birds, seed 0], each model at its CPU best
  layer (seed_pairs_cpu.json pairs): run20_seed2 - run20_fsdonly +0.0041 [-0.0104, +0.0172]; run20_seed2 -
  run16_compute4x -0.0029 [-0.0272, +0.0178]; run20_fsdonly - run16_compute4x -0.0070 [-0.0355, +0.0167];
  run20_seed2 - run21_zfonly +0.0196 [-0.0040, +0.0436]; run20_fsdonly - run21_zfonly +0.0155 [-0.0076, +0.0370];
  run20_seed2 - aves-base-bio -0.0114 [-0.0305, +0.0052]; run20_seed2 - run19_seed2 -0.0223 [-0.0419, -0.0049];
  run20_seed2 - run19_avesteacher -0.0135 [-0.0338, +0.0026].

  Detection (detection_variants.json precommit; not affected by 076): run20_seed2 joint arm matched_L3, ZF AUC
  0.9659, BirdPark AP 0.7687 (native_L3 0.7448); run20_fsdonly joint arm native_L3, ZF AUC 0.9674, BirdPark AP 0.8266
  (matched_L3 0.6374). The two seeds swap which arm is better on BirdPark, the arm-selection noise of 049/061.'
method: 'slurm/train_run20_seed2.sh (train_run20_fsdonly.sh with --seed 2), job 39945376, COMPLETED after 05:37:49 at
  step 93,750 (epoch=77). harness/score_run.sh (export verified bit-identical) for detection and the MPS call-type
  JSON; zfeval/experiments/calltype_cpu_rescore.py --only run20_seed2 for the CPU call type;
  zfeval/experiments/seed_pairs_cpu.py for the paired bird bootstrap on CPU embeddings.'
provenance: 'analysis/calltype_cpu_rescore.json (models.run20_seed2, run20_fsdonly, run21_zfonly, run16_compute4x,
  run16_seed2, run16_seed3, run19_avesteacher, run19_seed2, aves-base-bio: acc11_cpu, best_layer_cpu, acc11_L3_cpu);
  analysis/seed_pairs_cpu.json (pairs); analysis/run20_seed2_calltype.json (MPS, superseded by the CPU score);
  analysis/detection_variants.json (precommit.run20_seed2, precommit.run20_fsdonly); savio_artifacts/logs/*_39945376.log.'
caveats: 'Not yet reviewed by a critic. Best layers chosen on the reported metric (035); layer 3 given beside them.
  run21 (the zebra-finch-only twin) has one seed, so the run20-vs-run21 contrast rests on a single baseline run.
  This finding does not edit 061; it re-reads 061''s call-type comparison on CPU embeddings, where the run20 point
  estimate drops by 0.0087 and run21''s by 0.0024. The chick-holdout and label-free numbers score_run.sh wrote for
  run20_seed2 were computed from MPS embeddings (076) and are not quoted.'
