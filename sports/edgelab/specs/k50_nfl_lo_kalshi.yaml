id: k50_nfl_lo_kalshi
family: nfl_lines
dataset: kalshi_openers_nfl
hypothesis: 'k50_strike (notes/k50_strike.md, pre-registered 2026-11-13 before any outcome). LO-NFL: L33 logger models (total C, spread B home margin) as Normal(m, sigma=13.09 total / 12.51 margin, prior-season sd(final - open)); over every two-sided strike and side EV = P - (ask + fee); bet the max if EV >= 0.03/contract; graded on final; CLV = close - strike signed.'
decision_time: later of L33 model-cache time and Kalshi first-tight hour (>=30 min pre-kick); hourly candles
split: vault:kalshi_openers_nfl
legacy: new 2026-11-13 (agent k50_strike). Dev = same games as K1/K-CFB/K-NFL dev (disclosed). Pass dev only if ROI p < family bar AND CLV > 0; GO forward if ROI>0, CLV>0, n>=15; kill ROI CI upper < 0 or CLV <= 0 with n >= 20.
rule: edgelab.rules.forward:unwired
price_model: taker
min_n: 100
kill:
  kind: clv_negative_significant
  after_n: 100
  p: 0.05
fee:
  rounding: exact
