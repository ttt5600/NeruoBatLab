id: grh7_hyped_unders
family: game_release
dataset: game_release_hype
rule: edgelab.rules.game_release_hype:hyped_unders
params:
  window: 7
  h_min: 600000000
hypothesis: 'GRH1 (user pushback 11-11, "GTA VI is far bigger"): the post-launch slump only shows for EXTREMELY hyped
  launches. Bet UNDER every NFL/NBA/NHL/CFB regular/post-season game on days 0..6 after a paid-software launch cluster
