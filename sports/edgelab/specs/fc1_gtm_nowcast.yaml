id: fc1_gtm_nowcast
family: kalshi_data_ladders
dataset: fx_climate
rule: edgelab.rules.fx_climate:gtm
params:
  k: 3.0
  gap_days: 2
hypothesis: 'FC1: ForecastEx GTM (NOAA monthly global land+ocean departure, 1901-2000 base). After month M ends and its
  ERA5 daily global 2 m anomalies are public (M_end + 5 d), pred = ERA5 monthly mean + c (c, sd fit 2015-01..2024-06).
  Strike X with pred + 3 sd <= X -> buy NO; pred - 3 sd > X -> buy YES. Bought on the earliest CT trade-day starting
  after the input was public and >= 2 days before expiry on which that instrument traded, at that day''s HIGH trade
  (daily files carry no bid/ask; worst price any buyer paid) + $0.01 fee; hold to settlement.'
decision_time: end of the first CT trade-day starting after M_end + 6 d 00:00 UTC on which the bought instrument traded
price_model: taker
split: vault:fx_climate
min_n: 30
kill:
  kind: losses_in_first
  n: 30
  max_losses: 2
fee:
  schedules:
    taker: forecastex
legacy: 'new 2026-11-06 (scripts/fx_climate.py; census of ForecastEx physical families in notes/fx_climate.md). Not a
  re-run of forecastex_wx2 (UL/SH/DH daily weather): monthly climate releases, nowcast from published reanalysis.'
